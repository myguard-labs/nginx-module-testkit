name: ci

# PR-only. A push trigger would double every run and, on merge, re-run the exact
# commit that just passed as a PR -- see the merge-gate note in the README.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The harness's own parsers and assertion evaluators, as pure functions. No
  # server involved, so this is fast and is the gate that actually blocks.
  # Two legs: gcc and clang, both uninstrumented.
  #
  # Why a bare `SAN=0` leg is the one worth keeping: it is the miscompile /
  # optimizer-divergence canary -- a bug that only exists in the codegen the
  # sanitizers do not produce. No other job here covers that. `analyzers` is
  # static, so it never executes anything; `reproducible-build` compares two
  # builds of the same flags to each other, which is silent about whether
  # either one is correct; and `build-flags-canary` asserts the flags, not the
  # behaviour of the binary they produce. Nothing else in this workflow RUNS
  # the assertions against an uninstrumented build.
  #
  # The ASan+UBSan legs were dropped 2026-07-30 to implement the 2026-07-28
  # policy (README "What this repo is -- and what it is not"): no sanitizer
  # legs in this repo's CI, on nginx or on our own binary. They had been
  # written into README.md and AGENTS.md on 2026-07-28 but never removed from
  # this file. `SAN=1 ci/prober/test.sh` remains for a one-off local run when a
  # parser bug is suspected -- that, not a permanent CI leg, is the move.
  selftest:
    runs-on: [self-hosted, builder02, lxc]
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    name: selftest (${{ matrix.cc }})
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - name: build + run self-tests
        env:
          CC: ${{ matrix.cc }}
          SAN: "0"
        run: ci/prober/test.sh

  # The selftest job above proves the tests RUN. This one proves they ASSERT.
  #
  # A harness whose tests cannot fail is worse than one with no tests, because
  # the run still reports success -- and that failure mode is invisible to every
  # other job here. mutate.sh breaks the code on purpose, once per known
  # behaviour, and requires the named suite to go red each time. It has caught a
  # real gap on every pass so far, including a directive whose entire effect was
  # untested behind assertions that looked thorough.
  #
  # Blocking rather than scheduled: it rebuilds once per mutation, but the whole
  # sweep is well under a minute, and a coverage gap is cheapest to fix in the PR
  # that introduces it.
  mutation:
    runs-on: [self-hosted, builder02, lxc]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      # MUT_KIND=c because this job is a bare checkout: no nginx tarball, no
      # .build/<flavor>-<version>/objs, so a scenario suite cannot boot a server
      # here. The scenario rows run in the `scenarios` job, which stages that
      # tree. Running them here reported `caught` for 11 rows that never
      # executed their driver -- the suite bailed on the absent tree and the
      # nonzero exit was read as a caught mutation.
      - name: mutation smoke test (C suites)
        env:
          MUT_KIND: c
        run: ci/prober/mutate.sh

  # Corpus replay of the parser fuzz targets, under gcc + ASan/UBSan, on the PR
  # path. This is the deterministic, engine-free half of the fuzzing story: each
  # fuzz_<t>.c is linked with the standalone driver and fed the checked-in
  # corpus once, and a crash or sanitizer abort exits nonzero and fails the job.
  # Unbounded libFuzzer discovery (which needs clang and mutates without a fixed
  # iteration bound) is the SCHEDULED fuzz.yml workflow, off this per-commit path.
  #
  # The gate is proven non-vacuous the same way every other gate here is: a
  # planted out-of-bounds read in json_parse_n makes replay abort under ASan and
  # exit nonzero (see ci/prober/fuzz/README.md). A fuzz target that "reports but
  # exits 0" is the canonical vacuous fuzz gate, and the standalone driver does
  # not admit one: a crash kills the process, and the driver's only report is a
  # count of files it actually fed to the target, with zero files exiting
  # nonzero -- so an emptied corpus fails here instead of passing silently.
  fuzz-replay:
    runs-on: [self-hosted, builder02, lxc]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      # The fuzz targets link the whole prober library, which pulls OpenSSL
      # (body_sha256), zlib (gunzip) and, since H2-2, libnghttp2 (the h2 arm --
      # SUPERVISOR D2: a hard build dependency of the prober LIB, so every leg
      # that links it needs the -dev package, the same way libssl-dev/
      # zlib1g-dev already are here). ubuntu-latest ships the -dev packages,
      # but install them explicitly rather than rely on the image: an image
      # that drops one would fail this step with a clear apt error instead of
      # a mystery link failure, and it keeps parity with fuzz.yml's install
      # step.
      - name: install link deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libssl-dev zlib1g-dev libnghttp2-dev

      - name: replay parser fuzz corpus
        run: ci/prober/fuzz/fuzz.sh replay

  # Deterministic algorithmic-cost gate: parsing an 8x larger JSON document must
  # cost ~8x the instructions, never ~64x. Cachegrind counts instructions
  # exactly and reproducibly, so an instruction-count RATIO is a stable,
  # host-independent proxy for asymptotic complexity -- the replacement for the
  # rejected wall-clock `expect time<ms` directive. Its own job (not the
  # scenarios matrix) because Cachegrind must LAUNCH the process it measures and
  # cannot attach to a live nginx worker; it drives json_parse_n directly.
  cachegrind-scale:
    runs-on: [self-hosted, builder02, lxc]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      # valgrind for cachegrind; libssl/zlib/libnghttp2 are link deps of the
      # prober library the harness links (same set as fuzz-replay, libnghttp2
      # added by H2-2 -- SUPERVISOR D2). Installed explicitly so a missing one
      # fails with a clear apt error, not a mystery link failure.
      - name: install cachegrind + link deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind libssl-dev zlib1g-dev libnghttp2-dev

      - name: json parser instruction-count scaling gate
        run: ci/prober/perf/cachegrind-scale.sh

  # Compiling the probe against real nginx headers is what proves the generic
  # split is actually generic. It is not enough that it builds standalone: the
  # ngx_* types, the slab pool layout and the ngx_slprintf format specifiers all
  # come from the server, and a mismatch there only shows up here.
  probe-compiles:
    runs-on: [self-hosted, builder02, lxc]
    strategy:
      fail-fast: false
      matrix:
        # Three real trees, not one: the stable line (1.28.x), the mainline line
        # (1.29.x) and angie. The probe compiles against ngx_* types, the slab
        # pool layout and ngx_slprintf specifiers, and those drift BETWEEN the
        # stable and mainline branches -- a struct field renamed or a macro
        # changed on mainline while stable still ships the old one is exactly the
        # break a single-version matrix would let a consumer discover instead of
        # this job. The version is spelled in the flavor label so a red leg names
        # which line broke.
        # `flavor` stays nginx/angie -- it is a code contract, not a label: the
        # probe emits it as a compile-time marker string checked below, and
        # test-scenarios.sh keys the configure recipe off it. The nginx LINE
        # (stable 1.28.x vs mainline 1.29.x) is a separate `version` axis, so
        # both nginx legs run the same recipe over different source trees.
        include:
          - flavor: nginx
            version: 1.28.0
            url: https://nginx.org/download/nginx-1.28.0.tar.gz
            sha256: c6b5c6b086c0df9d3ca3ff5e084c1d0ef909e6038279c71c1c3e985f576ff76a
          - flavor: nginx
            version: 1.29.0
            url: https://nginx.org/download/nginx-1.29.0.tar.gz
            sha256: 109754dfe8e5169a7a0cf0db6718e7da2db495753308f933f161e525a579a664
          - flavor: angie
            version: 1.12.0
            url: https://download.angie.software/files/angie-1.12.0.tar.gz
            sha256: cd7867d200b22a80165b93696c30a1ac3a28c1162544b7f43c71232b19814ef6
    name: probe compiles against ${{ matrix.flavor }} ${{ matrix.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      # Cache the fetched + configured tree. This job only ./configures (no
      # make), so the saving is the download + the configure run, both of which
      # are identical across every run for a given source hash. Same content-
      # addressed key discipline as the scenarios job: matrix.sha256 pins the
      # source, and the trailing salt covers the configure recipe. No t/module
      # here (this job does not build it in), so no hashFiles term is needed.
      # The tarball is still re-verified against its hash on a MISS.
      - name: cache the configured ${{ matrix.flavor }} tree
        id: srv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/srv
          key: srv-configured-${{ matrix.flavor }}-${{ matrix.sha256 }}-v1

      - name: install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends eatmydata
          sudo eatmydata apt-get install -y --no-install-recommends \
              libpcre2-dev zlib1g-dev libssl-dev

      # Downloaded, checked, THEN unpacked -- never `curl | tar`. Piping
      # straight into tar extracts whatever is served at the moment CI runs,
      # which makes every run trust a third party's current state of mind. The
      # nginx hash below was taken from a tarball whose detached PGP signature
      # verified against Sergey Kandaurov's F5 release key, so it pins a
      # genuine release rather than merely the first thing we happened to see.
      # Angie ships no comparable signature, so its hash is trust-on-first-use:
      # weaker, but it still turns a silent substitution into a failed job.
      # Skipped whole on a cache hit -- the restored tree is already configured.
      - name: fetch + configure ${{ matrix.flavor }}
        if: steps.srv-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/srv
          curl -fsSL -o /tmp/srv.tar.gz "${{ matrix.url }}"
          echo "${{ matrix.sha256 }}  /tmp/srv.tar.gz" | sha256sum -c -
          tar -xzf /tmp/srv.tar.gz -C /tmp/srv --strip-components=1
          cd /tmp/srv
          ./configure --with-compat --without-http_rewrite_module >/dev/null

      # -DNGX_TEST_HARNESS is the whole point: the file is deliberately empty
      # without it, so a build that forgets the define would "pass" while
      # compiling nothing.
      #
      # Note what is NOT passed: the flavor macros. Those are derived by the
      # header from the server's own version macros, and hard-coding them here
      # would mean CI compiles a configuration no consumer ever builds -- and
      # would skip the detection this job exists to check.
      # -fstack-usage emits a sibling .su file next to each -o output (one
      # line per function -- see the stack-frame-budget step below, which
      # reads these). It costs nothing on a build that is not shipped, so it
      # is on unconditionally here rather than gated behind a second recompile
      # that could drift from what this step actually produces.
      - name: compile the probe
        run: |
          for unit in ngx_test_probe ngx_test_probe_arm; do
              cc -c -o "/tmp/$unit.o" \
                 -DNGX_TEST_HARNESS \
                 -O1 -Wall -Wextra -Werror -Wpointer-arith \
                 -fstack-usage \
                 -I/tmp/srv/src/core -I/tmp/srv/src/event \
                 -I/tmp/srv/src/event/modules -I/tmp/srv/src/os/unix \
                 -I/tmp/srv/src/http -I/tmp/srv/src/http/modules \
                 -I/tmp/srv/objs \
                 "src/$unit.c"
              test -s "/tmp/$unit.o"
          done

          # The two units share ngx_test_probe_hooks, and the renderer reaches
          # it as an extern. Link them together so a missing or duplicated
          # definition fails here rather than in a consumer's build.
          ld -r -o /tmp/probe-combined.o /tmp/ngx_test_probe.o \
                                         /tmp/ngx_test_probe_arm.o

      # Angie defines NGINX_VERSION as well as ANGIE_VERSION, so the flavor
      # detection is a genuine either/or that a compile alone does not exercise
      # -- get the branch backwards and both servers still build, both report
      # "nginx", and every rule that discriminates on flavor silently tests the
      # wrong thing. The string is in the object file, so check it there.
      - name: the detected flavor is ${{ matrix.flavor }}
        run: |
          if ! strings /tmp/ngx_test_probe.o | grep -qx '${{ matrix.flavor }}'; then
              echo "flavor string '${{ matrix.flavor }}' absent from the object;" \
                   "detection in ngx_test_probe.h picked the wrong branch" >&2
              strings /tmp/ngx_test_probe.o | head -20 >&2
              exit 1
          fi

      # The disabled build is a shipped configuration too: consumers build the
      # module without TEST_HARNESS for release, and angie's configure adds
      # -Werror, which is why the empty-TU guard exists at all.
      - name: compile with the harness disabled
        run: |
          for unit in ngx_test_probe ngx_test_probe_arm; do
              cc -c -o "/tmp/$unit-off.o" \
                 -O1 -Wall -Wextra -Werror -Wpointer-arith \
                 -I/tmp/srv/src/core -I/tmp/srv/src/event \
                 -I/tmp/srv/src/event/modules -I/tmp/srv/src/os/unix \
                 -I/tmp/srv/src/http -I/tmp/srv/src/http/modules \
                 -I/tmp/srv/objs \
                 "src/$unit.c"
          done

      # "Never ship the probe in a release build" is policy, not a check, until
      # something actually reads the disabled objects. The file is a deliberate
      # empty TU without -DNGX_TEST_HARNESS (see the compile step above), so
      # this also catches that guard regressing -- if #ifdef NGX_TEST_HARNESS
      # ever narrows to cover less than it should, probe strings leak into the
      # -off.o built here and this is what would notice.
      #
      # `strings` over the whole object also matches the compilation-unit
      # filename GCC stashes in .symtab (e.g. "ngx_test_probe.c" from an
      # otherwise-empty TU), which is a false positive with no bearing on what
      # ships. Pull .rodata/.data out first with objcopy so the check only
      # sees bytes that could actually appear in the running binary's string
      # or data pool.
      - name: harness-disabled build carries no probe strings
        run: |
          # Wildcarded: -O1 merges string literals into .rodata.str1.1, not
          # plain .rodata, so an unwildcarded --only-section would silently
          # extract zero bytes and pass vacuously.
          for unit in ngx_test_probe ngx_test_probe_arm; do
              objcopy -O binary -j '.rodata*' -j '.data*' \
                  "/tmp/$unit-off.o" "/tmp/$unit-off.bin"
          done

          hits=$(strings /tmp/ngx_test_probe-off.bin /tmp/ngx_test_probe_arm-off.bin \
                 | grep -E 'ngx_test_probe|fault_slab' || true)
          if [ -n "$hits" ]; then
              echo "the harness-disabled object contains probe strings -- the" \
                   "#ifdef NGX_TEST_HARNESS guard is not empty in a release" \
                   "build:" >&2
              echo "$hits" >&2
              exit 1
          fi

      # A module may NEVER kill the worker process: exit()/abort()/assert() in
      # a unit that compiles into nginx takes down every other connection that
      # worker is serving, which makes this a correctness bug, not a style
      # nit. strcpy/sprintf/strcat/gets are banned outright regardless of
      # context -- there is no call site in this probe that needs an unbounded
      # copy. `system()` would be a command-injection primitive sitting inside
      # a request-handling path.
      #
      # `nm --undefined-only` lists symbols this object REFERENCES but does
      # not define (type U) -- that is what "calls strcpy" looks like in an
      # object file. Using plain `nm` output without filtering on U would also
      # match, e.g., a local variable that merely happens to be named
      # `assert`, so the type column is load-bearing here. -A prefixes every
      # line with its source file so the two objects can be scanned in one
      # pass without the multi-file "==> file <==" banners `nm` otherwise
      # inserts changing the column layout.
      - name: probe objects call none of the banned libc functions
        run: |
          banned='strcpy|sprintf|strcat|gets|system|exit|_exit|abort|assert|__assert_fail'
          hits=$(nm -A --undefined-only /tmp/ngx_test_probe.o /tmp/ngx_test_probe_arm.o \
                 | awk -v re="^($banned)\$" '$2 == "U" && $3 ~ re {print}')
          if [ -n "$hits" ]; then
              echo "probe object references a banned function -- a module must" \
                   "never kill the worker (exit/abort/assert) or use an" \
                   "unbounded-copy libc call (strcpy/sprintf/strcat/gets/system)" \
                   "in code that compiles into nginx:" >&2
              echo "$hits" >&2
              exit 1
          fi

      # Two modules loaded into the same worker share one flat C symbol
      # namespace -- a second module with an unprefixed global (or one that
      # merely picks the same name) silently collides at link time, or worse,
      # links clean and calls the wrong function. `nm --defined-only` lists
      # symbols this object EXPORTS (T/B/D/R/... -- uppercase = global); the
      # namespace check only makes sense against those. Filtering by type also
      # excludes the compiler's own local-scope symbols (.LC0 string-literal
      # labels, `key.0` for a static const) that nm reports in lowercase and
      # that were never candidates for collision to begin with.
      - name: probe globals are all ngx_test_-prefixed
        run: |
          hits=$(nm -A --defined-only /tmp/ngx_test_probe.o /tmp/ngx_test_probe_arm.o \
                 | awk '$2 ~ /^[A-Z]$/ && $3 !~ /^ngx_test_/ {print}')
          if [ -n "$hits" ]; then
              echo "probe object exports a global symbol not prefixed" \
                   "ngx_test_ -- two modules sharing a worker share one symbol" \
                   "namespace, so an unprefixed export is a silent collision" \
                   "waiting to happen:" >&2
              echo "$hits" >&2
              exit 1
          fi

      # Stack-frame budget. -fstack-usage emits one .su line per function:
      # "file:line:col:func <bytes> <qualifier>", qualifier one of static (the
      # compiler proved an exact size), bounded (the frame has a
      # variable-length piece -- a VLA or a bounded alloca -- but the compiler
      # proved an upper bound, which is the number reported) or dynamic (no
      # upper bound could be proven; the number, if any, is a lower bound and
      # is not the whole story).
      #
      # 4KB, per the TODO. Nginx does not set a custom stack size for worker
      # processes -- they run on whatever RLIMIT_STACK / the pthread default
      # gives them (8MB is typical on Linux, but is not this repo's to assume,
      # since a consuming module's own deployment can lower it) -- so the
      # limit here is not "how many 4KB frames fit," it is recursion depth and
      # call-chain headroom. A worker's C call chain by the time control
      # reaches module code is already several frames deep through nginx's own
      # event/http dispatch, http filter chain, and (for this harness
      # specifically) whatever the consuming module's own handler stacked on
      # top before calling into the probe. 4KB leaves that chain generous
      # headroom while still catching the actual bug class the TODO names: a
      # response buffer, a path buffer, or a scratch array declared on the
      # stack instead of allocated from the request pool. Nothing in this
      # probe legitimately needs anywhere close to 4KB in one frame --
      # ngx_test_probe_json renders into a caller-supplied buffer via pointer
      # arithmetic, it does not stage the document on its own stack.
      #
      # `dynamic` frames are handled by treating "no proven bound" as failing
      # closed: this codebase has no legitimate use for a VLA or alloca sized
      # by unbounded input (the JSON renderer bounds everything against
      # `last`), so a dynamic qualifier here means either a new VLA the review
      # above missed or a compiler that could not analyze the frame -- either
      # way it does not get to self-report as fine. `bounded` is trusted at
      # its reported number, because the compiler proved that number is the
      # ceiling.
      - name: probe stack frames stay under budget
        run: |
          STACK_BUDGET=4096

          fail=0
          for su in /tmp/ngx_test_probe.su /tmp/ngx_test_probe_arm.su; do
              while IFS=$'\t' read -r loc bytes qual; do
                  [ -n "$loc" ] || continue
                  case "$qual" in
                      dynamic)
                          echo "unbounded (dynamic) stack frame -- no compile-time" \
                               "bound was proven, which this codebase has no" \
                               "legitimate reason to need: $loc ($bytes bytes" \
                               "reported, not a ceiling)" >&2
                          fail=1
                          ;;
                      static|dynamic,bounded)
                          if [ "$bytes" -gt "$STACK_BUDGET" ]; then
                              echo "stack frame exceeds ${STACK_BUDGET}-byte budget:" \
                                   "$loc uses $bytes bytes ($qual)" >&2
                              fail=1
                          fi
                          ;;
                      *)
                          echo "unrecognized .su qualifier '$qual' for $loc --" \
                               "treat as failing until this gate knows what it" \
                               "means" >&2
                          fail=1
                          ;;
                  esac
              done < "$su"
          done

          if [ "$fail" -ne 0 ]; then
              exit 1
          fi

      # .o size budget -- the closest honest form of the TODO's ".so size
      # budget" gate for what this repo actually builds. There is no .so
      # here: the probe compiles as two relocatable objects that a CONSUMING
      # module links into its own nginx/angie .so, so this repo has no
      # artifact to weigh against a shared-object budget in the TODO's literal
      # sense. What it does own is the object-code footprint it hands to that
      # consumer, and that number creeping up silently (a debug helper left
      # in, a table that should have been computed instead of unrolled) is the
      # same "bloat-creep" failure mode the TODO is guarding against, one
      # layer down the pipeline.
      #
      # Budget is on the linked (`ld -r`) combined object, .text+.data+.bss,
      # via `size`'s decimal total -- the whole footprint a consumer's link
      # step pays for, not just code. Current size is under 5KB; 16KB gives
      # ~3x headroom for legitimate growth (a new hook, a new probe field)
      # while still catching an accidental multi-KB regression (an unrolled
      # table, a copy-pasted duplicate of the renderer) the same day it lands.
      - name: probe object size stays under budget
        run: |
          SIZE_BUDGET=16384

          total=$(size /tmp/probe-combined.o | awk 'NR==2 {print $4}')
          if [ "$total" -gt "$SIZE_BUDGET" ]; then
              echo "combined probe object exceeds ${SIZE_BUDGET}-byte budget:" \
                   "$total bytes (text+data+bss) -- see 'size" \
                   "/tmp/probe-combined.o' for the breakdown" >&2
              exit 1
          fi

  # Every header a consumer might #include on its own must not silently
  # depend on some OTHER header having been included first -- that kind of
  # hidden dependency only surfaces once a consumer's include order happens
  # to differ from this repo's own, which is exactly when it is hardest to
  # debug.
  #
  # "Standalone" means something different in each directory here, and
  # faking a uniform pass by excluding whatever does not fit would defeat the
  # gate:
  #
  #   - ci/prober/*.h are real, freestanding C headers with no nginx dependency
  #     at all (the prober is a plain userspace program). Every one of them
  #     must compile with -fsyntax-only given nothing but -I prober, full
  #     stop.
  #   - t/ngx_core.h, t/ngx_config.h and t/ngx_shim.h are deliberately NOT
  #     real nginx headers -- they are a purpose-built shim (see the comment
  #     atop t/ngx_shim.h) that exists only to satisfy #include <ngx_config.h>
  #     / <ngx_core.h> for the one file that needs it. They are self-
  #     contained by construction (ngx_config.h and ngx_core.h just #include
  #     "ngx_shim.h", which pulls in nothing but libc headers), so they are
  #     held to the same "-fsyntax-only, -I t, nothing else" standard.
  #   - src/ngx_test_probe.h explicitly documents that it depends on real
  #     <ngx_config.h> / <ngx_core.h> (see its own header comment: "this
  #     depends only on <ngx_core.h>"). That is a deliberate, minimal,
  #     DOCUMENTED dependency, not a hidden one -- the whole point of the
  #     probe-compiles job above is proving this header and the .c files that
  #     include it build clean against real nginx AND real angie headers,
  #     which is a strictly stronger check than -fsyntax-only against a stub.
  #     Re-testing it here with the t/ shim would either (a) fail for a
  #     reason that has nothing to do with a hidden dependency -- the shim is
  #     deliberately minimal and does not carry ngx_module.h /
  #     ngx_core_module.h et al -- or (b) require growing the shim into a
  #     second, divergent partial nginx, which is the coupling the shim's own
  #     comment already rejects. So it is excluded here, WITH this comment,
  #     not silently -- and it is still gated, just by the stronger check
  #     already running in probe-compiles.
  # Every other job here compiles the probe. NONE of them ever booted a server
  # and made a request to it, so Layer 3 -- the scenario tree, run-scenario.sh,
  # the rule engine, the probe's actual JSON -- was fully built and fully
  # unexercised. That is how the s43 flaky-fork bug nearly merged, and it is
  # why this job precedes the first driver.sh landing rather than following it.
  #
  # It builds a real nginx/angie with t/module (the reference consumer of the
  # probe) linked in as a dynamic module, then runs the whole scenario tree
  # against the running server.
  #
  # Matrixed over FLAVOR, one job per flavor rather than per script x flavor:
  # test-scenarios.sh already iterates the tree and reports one TAP line per
  # scenario, so splitting further would pay the nginx build cost repeatedly to
  # learn nothing extra.
  scenarios:
    runs-on: [self-hosted, builder02, lxc]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Stable line. A second full build+boot leg over nginx stable so a
          # scenario that passes on mainline but breaks on stable (a module path
          # depending on a mainline-only behaviour) is caught here rather than by
          # a consumer pinned to stable.
          - flavor: nginx
            version: 1.28.0
            url: https://nginx.org/download/nginx-1.28.0.tar.gz
            sha256: c6b5c6b086c0df9d3ca3ff5e084c1d0ef909e6038279c71c1c3e985f576ff76a
          - flavor: nginx
            version: 1.29.0
            url: https://nginx.org/download/nginx-1.29.0.tar.gz
            sha256: 109754dfe8e5169a7a0cf0db6718e7da2db495753308f933f161e525a579a664
            mutation_rows: true
          - flavor: angie
            version: 1.12.0
            url: https://download.angie.software/files/angie-1.12.0.tar.gz
            sha256: cd7867d200b22a80165b93696c30a1ac3a28c1162544b7f43c71232b19814ef6
          # There is deliberately no sanitizer leg here. A live ASan+UBSan
          # server instruments nginx core, and this repo does not test nginx's
          # memory safety -- nginx is the fixture, never the subject (README
          # "What this repo is -- and what it is not", decided 2026-07-28,
          # implemented here 2026-07-30). Do not add one back without the user
          # asking for it.
    name: scenarios (${{ matrix.flavor }} ${{ matrix.version }})
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      # The configured + fully built server tree is what this job's `make -j`
      # spends its minutes on, and none of its inputs change between runs of the
      # same PR: the source is pinned by sha256 and the reference module is the
      # only local input. Cache the whole /tmp/srv tree so a rebuild is paid
      # once per (source, module) pair rather than on every push to the branch.
      #
      # The key is CONTENT-addressed, which is what makes caching safe here:
      #   - matrix.sha256 pins the exact server tarball (an attacker cannot
      #     make a different source hash to the same key);
      #   - hashFiles() busts the cache when ANY file the build compiles
      #     changes (t/module/** and src/**, which hold the module and probe);
      #   - the trailing salt (bump on any configure/make change below)
      #     covers the build recipe itself, which hashFiles cannot see.
      # There is no signing or publishing in this job, so a poisoned cache can at
      # worst fail the build -- and the restored tree is never trusted blind: the
      # tarball is re-verified against its sha256 on every cache MISS anyway.
      - name: cache the built ${{ matrix.flavor }} tree
        id: srv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/srv
          # The trailing salt covers the CONFIGURE RECIPE, which hashFiles
          # cannot see: the tarball hash pins the source, hashFiles pins module
          # and probe sources, but ./configure below is workflow text. Went to
          # v2 when --with-http_ssl_module was added: a v1 entry would restore
          # a tree built WITHOUT ssl, causing reds that blame TLS not the cache.
          # Went to v3 when src/** was added: v2 entries cached stale binaries
          # on probe-only changes. Went to v4 when --with-http_v2_module was
          # added (H2-2): a v3 entry would restore a tree built WITHOUT h2,
          # causing scenarios/h2-roundtrip's `requires` gate to SKIP every run
          # rather than exercise the new arm -- the same failure shape v2 was
          # added to prevent, one flag later. Bump on any configure/make
          # recipe change.
          key: srv-built-${{ matrix.flavor }}-${{ matrix.version }}-${{ matrix.sha256 }}-${{ hashFiles('t/module/**', 'src/**') }}-v4

      - name: install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends eatmydata
          sudo eatmydata apt-get install -y --no-install-recommends \
              libpcre2-dev zlib1g-dev libssl-dev libnghttp2-dev strace faketime
          # libnghttp2-dev: this job builds ci/prober/build.sh's output (the
          # "build the prober" step below), which links the h2 arm (H2-2) --
          # SUPERVISOR D2, a hard link dep the same way libssl-dev already is.
          # Without it the prober fails to link here with an undefined
          # reference to nghttp2_* symbols, not a subtle runtime skip.
          #
          # strace: the syscall-allowlist scenario attaches a tracer to the
          # worker and asserts on its per-request syscall set. Without it the
          # driver SKIPs (it guards on `command -v strace`), which would make
          # that leg silently vacuous rather than fail. GitHub's ubuntu runners
          # default to yama ptrace_scope=0, so a same-uid attach needs no
          # privilege.
          #
          # faketime: the clock-jump scenario LD_PRELOADs libfaketime to step
          # the worker's WALL clock mid-run. Without it the scenario's
          # `requires` gate SKIPs it -- same contract, and same hazard: a skip
          # here is a leg that proves nothing. This scenario spent its whole
          # life vacuous for want of exactly this dependency (it shipped no
          # env/driver at all until 2026-07-29), so the install is the thing
          # keeping it honest.

      # Same fetch discipline as probe-compiles: download, verify, THEN unpack.
      # Never `curl | tar`, which extracts whatever is served at the moment CI
      # runs. See that job's comment for what each hash is worth. Skipped whole
      # on a cache hit -- the restored tree is already configured and built.
      #
      # http_rewrite_module is NOT excluded here, unlike in probe-compiles:
      # the scenario confs use `return 200`, which is a rewrite-module
      # directive, so a build without it fails every scenario at the config
      # test with "unknown directive \"return\"".
      #
      # eatmydata wraps make: the runner is ephemeral, so fsync during the build
      # buys durability nobody will ever collect on. It does not weaken the
      # cache key -- the OUTPUT is byte-identical, only the write path changes.
      - name: fetch + build ${{ matrix.flavor }} with the reference module
        if: steps.srv-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/srv
          curl -fsSL -o /tmp/srv.tar.gz "${{ matrix.url }}"
          echo "${{ matrix.sha256 }}  /tmp/srv.tar.gz" | sha256sum -c -
          tar -xzf /tmp/srv.tar.gz -C /tmp/srv --strip-components=1
          cd /tmp/srv
          # Build with ssl to allow TLS scenarios to lift their requires-gate
          # instead of skipping. libssl-dev is already installed on this leg.
          #
          # --with-http_v2_module (H2-2): nginx's own ./configure defaults
          # HTTP_V2=NO even on the mainline/stable trees this job builds today
          # (measured 2026-08-27 against nginx 1.29.0's and angie 1.12.0's
          # ./configure -- both default to NO and both accept the flag
          # identically). Without it scenarios/h2-roundtrip's own `requires`
          # gate SKIPs every run rather than exercising the h2 arm H2-2 adds,
          # which would make that row vacuous on the only CI leg that boots a
          # live server for it.
          ./configure --with-compat --with-http_ssl_module --with-http_v2_module \
              --add-dynamic-module="$GITHUB_WORKSPACE/t/module" >/dev/null
          eatmydata make -j"$(nproc)" >/dev/null

      # prober_resolve looks for .build/<flavor>-<version>/objs under
      # PROBER_ROOT, so put the build products where it expects them.
      - name: stage the build where prober_resolve looks
        run: |
          mkdir -p ".build/${{ matrix.flavor }}-${{ matrix.version }}"
          cp -r /tmp/srv/objs ".build/${{ matrix.flavor }}-${{ matrix.version }}/"

      - name: build the prober
        run: ci/prober/build.sh

      # The syscall-allowlist scenario attaches strace to the worker, which
      # needs PTRACE_SEIZE. GitHub's ubuntu-latest ships yama
      # kernel.yama.ptrace_scope=1 (a non-child same-uid attach is denied), so
      # without this the scenario's own preflight SKIPs it and the leg is
      # vacuous. Lowering the scope to 0 (attach any same-uid process) makes it
      # actually run. Runner-only, torn down with the ephemeral VM; every other
      # scenario is indifferent to it.
      - name: allow ptrace attach (for the syscall-allowlist scenario)
        run: sudo sysctl -w kernel.yama.ptrace_scope=0

      # PROBER_MODULE / PROBER_DIRECTIVE / PROBER_PROBE are the consumer
      # contract -- normally supplied by the module under test. Here the
      # reference module in t/module plays that role. PROBER_ROOT is set
      # explicitly to pin it to the checkout; lib.sh otherwise derives it from
      # its own location (ci/prober/lib.sh -> repo root).
      - name: run the scenario tree against a live ${{ matrix.flavor }}
        env:
          PROBER_ROOT: ${{ github.workspace }}
          PROBER_MODULE: ngx_http_test_ref_module.so
          PROBER_DIRECTIVE: test_ref_probe
          PROBER_PROBE: "test_ref_probe;"
        run: ci/prober/test-scenarios.sh ${{ matrix.flavor }} ${{ matrix.version }}

      # A scenario tree that cannot fail is worth nothing, and this job is the
      # only place the tree ever executes -- so the mutation check belongs here
      # rather than in the mutation job, which mutates C and never boots a
      # server. Breaking one assertion in a scenario that DOES run must turn
      # the suite red; if it does not, the tree is decorative.
      #
      # conn-delta is the target because it asserts `delta fds == 0` on error
      # paths, which is the class of claim the whole harness exists for.
      - name: the scenario tree actually asserts (mutation)
        env:
          PROBER_ROOT: ${{ github.workspace }}
          PROBER_MODULE: ngx_http_test_ref_module.so
          PROBER_DIRECTIVE: test_ref_probe
          PROBER_PROBE: "test_ref_probe;"
        run: |
          RULE=ci/prober/scenarios/conn-delta/conn-delta.rule
          cp "$RULE" /tmp/rule.orig

          # Assert something the server does NOT do. A scenario that still
          # passes with this in place is not reading the response at all.
          sed -i 's/^expect  status=200$/expect  status=418/' "$RULE"

          if grep -q 'status=418' "$RULE"; then
              :
          else
              echo "mutation did not apply -- the rule format changed and this" \
                   "check is now vacuous" >&2
              exit 1
          fi

          if ci/prober/test-scenarios.sh ${{ matrix.flavor }} ${{ matrix.version }} \
                 >/tmp/mutant.tap 2>&1; then
              echo "MUTANT SURVIVED: conn-delta passed while asserting status=418" >&2
              sed -n '1,40p' /tmp/mutant.tap >&2
              cp /tmp/rule.orig "$RULE"
              exit 1
          fi

          # Red for the RIGHT reason: conn-delta specifically, not a bail-out
          # that took the whole run down before any assertion ran.
          if ! grep -q '^not ok .* - conn-delta$' /tmp/mutant.tap; then
              echo "the suite failed, but not on conn-delta -- the mutant may" \
                   "have broken the harness rather than tripped an assertion" >&2
              sed -n '1,40p' /tmp/mutant.tap >&2
              cp /tmp/rule.orig "$RULE"
              exit 1
          fi

          cp /tmp/rule.orig "$RULE"

      # The mutate.sh rows whose suites boot a real server. They live here and
      # not in the `mutation` job because only this job stages
      # .build/<flavor>-<version>/objs; run without it they bail before their
      # driver and every row reports `caught` on an exit no mutation caused.
      #
      # The step above mutates ONE rule file and proves the tree as a whole can
      # go red. These rows are finer-grained: each corrupts one oracle's own
      # bound and requires that oracle to red, which is the only way the
      # deliberately-vacuous cases (`... oracle vacuous`) can be checked at all.
      #
      # nginx only: these rows assert on oracle behaviour, not on flavor
      # differences, so running them once is enough. The scenario TREE still
      # runs on every flavor in the matrix.
      - name: the scenario mutation rows actually catch (mutation)
        if: matrix.mutation_rows
        env:
          PROBER_ROOT: ${{ github.workspace }}
          PROBER_MODULE: ngx_http_test_ref_module.so
          PROBER_DIRECTIVE: test_ref_probe
          PROBER_PROBE: "test_ref_probe;"
          MUT_KIND: scenario
          # These suites boot servers and sweep; the 120 s default is sized for
          # the C binaries and would report a caught mutation on wall clock.
          MUT_SUITE_TIMEOUT: "600"
        run: ci/prober/mutate.sh

  # The scenario mutation rows in `scenarios` select their leg with
  # `if: matrix.mutation_rows`, so the flag -- not a version literal -- is the
  # single source of truth for which leg runs them. That removes the silent-skip
  # on a version bump, but it moves the failure mode: a leg with no flag at all,
  # or a flag that drifted onto the angie leg, would again lose the rows with no
  # red anywhere (MUT_CHECK still reports the anchors live, so the loss is
  # invisible). This job is the loud failure. It is deliberately build-free.
  mutation-rows-gate:
    runs-on: [self-hosted, builder02, lxc]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - name: exactly one nginx scenarios matrix leg has mutation_rows
        run: |
          python3 - <<'PY'
          import sys, yaml

          with open('.github/workflows/ci.yml') as f:
              wf = yaml.safe_load(f)

          legs = wf['jobs']['scenarios']['strategy']['matrix']['include']
          flagged = [e for e in legs if e.get('mutation_rows')]

          def die(msg):
              print("ERROR: %s" % msg, file=sys.stderr)
              print("", file=sys.stderr)
              print("The scenario mutation rows run on exactly one leg, selected by"
                    " `mutation_rows: true` (ci.yml, `scenarios` job). They assert"
                    " oracle behaviour, not flavor differences, so they run on the"
                    " nginx mainline leg only. If you bumped or reordered the matrix,"
                    " move the flag with it -- do not drop it and do not put it on the"
                    " angie leg.", file=sys.stderr)
              sys.exit(1)

          if len(flagged) != 1:
              die("expected exactly 1 scenarios matrix leg with mutation_rows: true,"
                  " found %d" % len(flagged))

          leg = flagged[0]
          if leg.get('flavor') != 'nginx':
              die("the mutation_rows flag is on the %r leg; it must be on an nginx leg"
                  % leg.get('flavor'))

          print("ok: mutation_rows on %s %s" % (leg.get('flavor'), leg.get('version')))
          PY

  header-self-sufficiency:
    runs-on: [self-hosted, builder02, lxc]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - name: ci/prober/*.h compile standalone
        run: |
          fail=0
          for h in ci/prober/*.h; do
              echo "-- $h"
              if ! gcc -fsyntax-only -std=c11 -Wall -Wextra -I prober "$h"; then
                  fail=1
              fi
          done
          if [ "$fail" -ne 0 ]; then
              echo "one or more ci/prober/*.h headers do not compile standalone" \
                   "-- a header must not depend on some other header having" \
                   "been included first" >&2
              exit 1
          fi

      - name: t/ shim headers compile standalone
        run: |
          fail=0
          for h in t/ngx_core.h t/ngx_config.h t/ngx_shim.h; do
              echo "-- $h"
              if ! gcc -fsyntax-only -std=c11 -Wall -Wextra -I t "$h"; then
                  fail=1
              fi
          done
          if [ "$fail" -ne 0 ]; then
              echo "one or more t/ shim headers do not compile standalone" >&2
              exit 1
          fi

  shell:
    runs-on: [self-hosted, builder02, lxc]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          # Globbed, not listed: the previous explicit list silently stopped
          # covering the scripts added beside it, so a new script could ship
          # unlinted while the job still reported green. -x follows sourced
          # files (ci/prober/lib.sh is sourced by three entry points and is
          # where the engine actually lives).
          # --source-path is required alongside -x: the scripts `cd` to their
          # own directory and source `./lib.sh`, which shellcheck resolves
          # against ITS working directory (the repo root), not the script's.
          # Without it the follow fails and SC1091 fails the job.
          #
          # scenarios/*/driver.sh is globbed too: a scenario driver is a shell
          # entry point like the others (it sources lib.sh via PROBER_LIB and
          # runs the prober), so leaving it out would be the same silent-hole
          # the explicit-list comment above warns about. --source-path=ci/prober
          # still resolves its `# shellcheck source=lib.sh` directive.
          # verify-impact and pr-impact carry no .sh extension (P2-A/P2-C spec
          # names them as bare entry points, matching ci/prober/build.sh's own
          # style of naming things by role) so the *.sh glob above does not
          # pick them up -- list them explicitly rather than rename them and
          # lose the intended invocation form (`ci/prober/pr-impact`, not
          # `ci/prober/pr-impact.sh`).
          # tools/*.sh is globbed for the same reason as ci/prober/*.sh: it is a
          # script directory, and a directory that is linted only by an explicit
          # list is a directory that stops being linted the moment someone adds
          # to it. Nullglob so an empty tools/ is not a shellcheck argument
          # error -- the job should go red for a bad script, not for an absent
          # one.
          shopt -s nullglob
          shellcheck -x --source-path=ci/prober ci/prober/*.sh ci/prober/verify-impact ci/prober/pr-impact ci/prober/pr-memcheck ci/prober/scenarios/*/driver.sh tools/*.sh

      # The consumer-* scenarios listed in tools/gen-consumer-scenarios.sh are
      # GENERATED from a table in that script. Hand-editing one works locally
      # and is then silently reverted the next time anyone regenerates -- so the
      # edit survives review, lands, and disappears later without a trace. This
      # step regenerates into a temp dir and diffs, so a hand-edit fails here
      # with the diff printed rather than rotting.
      #
      # It lives in the `shell` job because it needs no nginx build: it is a
      # pure text check and belongs on every PR.
      - name: generated consumer scenarios are up to date
        run: tools/gen-consumer-scenarios.sh --check

      # Every mutate.sh row's anchor must still match its target file exactly
      # once. A row whose anchor was edited away by ordinary work is disarmed:
      # it tests nothing, and the `mutation` job only notices for the rows that
      # job actually runs -- never for the scenario rows, which run elsewhere.
      #
      # Here rather than in `mutation` on purpose. It builds nothing and runs no
      # suite (~1 s for 124 rows), so a disarmed row fails in the fast job
      # instead of 25-30 min into the CI long pole, and it covers the rows that
      # the long pole's own MUT_KIND selector skips.
      - name: mutate.sh anchors are all live
        run: MUT_CHECK=1 ci/prober/mutate.sh

      # Downloaded and hash-checked, same as the server tarballs above: a
      # linter that gates the build is as much a supply-chain dependency as
      # the code it lints.
      #
      # Note the absence of `|| true` and of any grep over the output. An
      # earlier version of this step captured SARIF and grepped it for a
      # severity string, which fails OPEN in two ways at once: the `|| true`
      # discards the real exit status, and a formatting change in the JSON
      # (or a severity spelled anything other than the grepped literal) makes
      # the pattern silently stop matching. A gate whose failure mode is
      # "passes quietly forever" is worse than no gate. actionlint already
      # exits non-zero on findings -- let it.
      - name: actionlint
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" \
              | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          # A bare directory is not accepted -- actionlint takes files, so glob.
          /tmp/actionlint -color .github/workflows/*.yml

      # zizmor audits workflows for script injection, unpinned actions and
      # over-broad permissions. Installed from the published wheel at a pinned
      # version rather than `cargo install` from git: a source build here would
      # be minutes of CI for a linter.
      #
      # --persona=regular, not pedantic. Pedantic flags every `${{ matrix.* }}`
      # interpolation in a run block as template injection. Here that is a
      # false positive by construction: the matrix is defined inline in this
      # same file with hardcoded tarball URLs, hashes and flavor names, so
      # nothing attacker-controllable reaches those expansions. The remaining
      # pedantic notes are `anonymous-definition` (jobs without a `name:`),
      # which is cosmetic. Regular still catches the findings that matter --
      # an unpinned action, a widened permission, a genuinely external input.
      - name: zizmor
        run: |
          pipx install zizmor==1.26.1
          zizmor --persona=regular .github/workflows/*.yml

  # Two gates that each close a bug class this repo already shipped once. Both
  # are static in the sense that they assert on the repository itself rather
  # than on behaviour, so they belong together in one cheap job.
  hygiene:
    runs-on: [self-hosted, builder02, lxc]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      # PR #6 committed a compiled assert_test binary. Nothing caught it: the
      # file was tracked, so .gitignore no longer applied to it, and every
      # other job happily rebuilt over the top. Ask `file` about every tracked
      # path instead -- an ELF that is checked in is always a mistake here,
      # since this repo ships only C sources and shell.
      - name: no tracked file is an ELF binary
        run: |
          hits=$(git ls-files -z | xargs -0 file --separator ':' -- \
                 | grep ' ELF ' || true)
          if [ -n "$hits" ]; then
              echo "tracked ELF binaries found -- compiled output must never be" \
                   "committed; check .gitignore and 'git rm --cached' these:" >&2
              echo "$hits" >&2
              exit 1
          fi

      # PR #4 let a new build artifact escape .gitignore. The artifact is only
      # created by a build, so the drift is invisible to a checkout-only job --
      # it has to actually build and run the suite first, then look. Both the
      # plain and the sanitizer build are checked because SAN=1 is a distinct
      # set of outputs.
      #
      # This SAN=1 build is NOT a sanitizer gate and does not contradict the
      # no-sanitizer-legs policy: nothing here is instrumented for a finding to
      # be reported against, no server is built, and a sanitizer diagnostic
      # cannot fail this step -- only a file appearing that .gitignore misses.
      # `SAN=1 ci/prober/test.sh` stays supported for local runs, so its artifact
      # set still needs the drift check.
      - name: build + test leaves the tree clean
        run: |
          for san in 0 1; do
              SAN="$san" ci/prober/test.sh >/dev/null

              dirty=$(git status --porcelain)
              if [ -n "$dirty" ]; then
                  echo "SAN=$san build/test left the working tree dirty --" \
                       "an artifact is missing from .gitignore:" >&2
                  echo "$dirty" >&2
                  exit 1
              fi
          done

  # Reproducible build. Build the same source twice and require the binaries to
  # be byte-identical, which catches a build embedding something that is not the
  # source: __DATE__/__TIME__, an absolute path, a hostname, anything read from
  # the environment at compile time. That matters here because a consumer links
  # this repo's objects into their own module -- an artifact that varies run to
  # run cannot be diffed against a rebuild, so "is the .so I am shipping built
  # from the commit I think it is" stops being an answerable question.
  #
  # The two builds are deliberately done at DIFFERENT paths (a longer directory
  # name, not merely a different one). Building twice at the same path is the
  # tempting shortcut and it is a vacuous gate: -g embeds the compilation
  # directory in .debug_line_str, so a same-path pair compares equal while the
  # path is still baked into the artifact -- the very thing this is supposed to
  # detect. Differing path LENGTHS also shift section offsets if anything
  # downstream depends on them, so the check fails loudly rather than subtly.
  #
  # One flag is required to make this pass, and it is the fix rather than a
  # workaround for it:
  #
  #   -ffile-prefix-map=$PWD=.  rewrites the recorded compilation directory to a
  #       relative marker. Without it, -g (on by default in build.sh) writes the
  #       absolute build path into DWARF. Measured: with this flag removed, all
  #       six artifacts differ, by exactly the bytes spelling the directory name.
  #
  # The GNU build-ID is deliberately NOT suppressed. An earlier draft of this
  # job passed -Wl,--build-id=none on the theory that the note is a per-link
  # hash and would differ between runs. Mutation-tested: removing the flag
  # leaves this gate green, because ld derives the build-ID from the linked
  # content, which is identical once the paths are mapped away. The build-ID
  # differences seen while first investigating this were a CONSEQUENCE of the
  # embedded paths, not an independent source of nondeterminism. Suppressing it
  # would therefore have hidden nothing and cost the artifacts their build-ID,
  # which debuggers and coredump tooling use -- so the note stays, and it is now
  # part of what this gate proves stable.
  #
  # SOURCE_DATE_EPOCH is exported for the same reason: it gives any timestamp a
  # build might reach for a fixed value instead of "now".
  reproducible-build:
    runs-on: [self-hosted, builder02, lxc]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - name: the same source builds byte-identically twice
        env:
          SOURCE_DATE_EPOCH: "1"
        run: |
          # Deliberately different lengths -- see the note above on why an
          # equal-length pair would let path embedding through.
          a=/tmp/rb-a
          b=/tmp/rb-b-deliberately-longer

          rm -rf "$a" "$b"
          cp -a . "$a"
          cp -a . "$b"

          for d in "$a" "$b"; do
              (
                  cd "$d"
                  CFLAGS="-O1 -g -std=c11 -Wall -Wextra -Werror \
                          -Wconversion -Wsign-conversion -Wshadow -Wvla \
                          -Wformat=2 -Wwrite-strings -Wcast-qual \
                          -Wpointer-arith -Wdeclaration-after-statement \
                          -ffile-prefix-map=$d=." \
                      ci/prober/build.sh >/dev/null
              )
          done

          # Compare every built artifact, not just the prober: a self-test
          # binary that embeds a path is the same bug, and checking only the
          # one obvious output is how a gate ends up covering less than its
          # name claims.
          fail=0
          for artifact in "$a"/prober/prober "$a"/prober/*_test "$a"/t/*_test; do
              [ -e "$artifact" ] || continue
              rel="${artifact#"$a"/}"
              if ! cmp -s "$artifact" "$b/$rel"; then
                  echo "not reproducible: $rel differs between two builds of" \
                       "identical source at different paths" >&2
                  cmp -l "$artifact" "$b/$rel" | head -20 >&2
                  fail=1
              fi
          done

          if [ "$fail" -ne 0 ]; then
              echo "" >&2
              echo "Something path-, time- or environment-dependent is being" \
                   "compiled in. Check for __DATE__/__TIME__, __FILE__ reaching" \
                   "a shipped string, or a new flag that defeats" \
                   "-ffile-prefix-map." >&2
              exit 1
          fi

  # Static analyzers. These read the prober's own C -- the rule parser, the JSON
  # parser and the HTTP response parser -- which is the half of this repo that
  # eats untrusted-shaped bytes. The probe half in src/ is deliberately NOT
  # analyzed here: it only compiles against real nginx headers, so it is covered
  # by the probe-compiles job, and pointing an analyzer at it with the t/ shim
  # would analyze a stub rather than what ships.
  #
  # All three run as BLOCKING gates rather than advisory reports. At the time
  # this job was added all three were clean on current source, so there is no
  # backlog to grandfather in -- which means any finding is new, and a gate that
  # fails on new findings is worth more than a report nobody reads. The check
  # selections below are therefore load-bearing: each exclusion is a category
  # judged unactionable for THIS codebase, not a way to reach zero.
  analyzers:
    runs-on: [self-hosted, builder02, lxc]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      # Versions are printed, not merely installed. These gates are only as
      # reproducible as the tools behind them, and the analyzers disagree with
      # each other across releases: the clang-tidy suppression below exists for
      # a finding that the runner's clang-tidy reports and 19.1.7 does not. When
      # a future run fails on something that passes locally, the first question
      # is "which version", and it should be answerable from the log rather than
      # by bisecting a runner image.
      - name: install analyzers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cppcheck clang-tidy

          echo "--- analyzer versions ---"
          gcc --version | head -1
          cppcheck --version
          clang-tidy --version | grep -i 'version'

      # GCC's own analyzer. Clean on current source with no exclusions at all,
      # so it runs with the plain flag set and -Werror: anything it says is
      # both new and, by this codebase's track record with it, worth reading.
      - name: gcc -fanalyzer
        working-directory: ci/prober
        run: |
          for f in json.c http.c h2.c util.c rules.c assert.c prober.c; do
              gcc -fanalyzer -Werror -c -O1 -std=c11 -I. "$f" -o /dev/null
          done

      # cppcheck. --error-exitcode=2 is what makes this a gate; without it
      # cppcheck prints findings and exits 0, which is the "passes quietly
      # forever" failure mode the actionlint step above was already fixed for.
      #
      # `style` is off deliberately. The only two style findings on current
      # source are constVariablePointer suggestions on strtok() results that
      # share a declaration line with pointers which genuinely are mutated --
      # taking the advice would mean splitting declarations for no defect.
      # warning/performance/portability stay on: those are the bug-finding
      # checks.
      #
      # normalCheckLevelMaxBranches is an informational note about analysis
      # depth, not a finding, and --check-level=exhaustive is what answers it.
      - name: cppcheck
        working-directory: ci/prober
        run: |
          cppcheck \
              --enable=warning,performance,portability \
              --std=c11 --check-level=exhaustive \
              --error-exitcode=2 --quiet \
              --suppress=normalCheckLevelMaxBranches \
              -I. json.c http.c h2.c util.c rules.c assert.c prober.c

      # clang-tidy. --warnings-as-errors mirrors the enabled list so a finding
      # fails the job.
      #
      # Four categories are excluded, each for a reason that is about this
      # codebase rather than about reaching a clean run:
      #
      #   security.insecureAPI.DeprecatedOrUnsafeBufferHandling
      #       Demands the C11 Annex K _s functions (memcpy_s, snprintf_s).
      #       Annex K is optional, glibc does not implement it, and there is
      #       nothing to migrate to. Every call it flags is already a bounded
      #       form (memcpy with a checked length, snprintf with sizeof).
      #   cert-err33-c
      #       Flags ignoring snprintf's return value. Every site is a
      #       diagnostic message rendered into a fixed buffer where truncation
      #       is the intended, acceptable outcome -- the alternative is
      #       error-handling a failure to format an error.
      #   bugprone-reserved-identifier / cert-dcl37-c
      #       Fires on #define _GNU_SOURCE, which is a required feature-test
      #       macro and cannot be spelled any other way. ALL THREE names are
      #       needed: clang-tidy reports this one under two cert- aliases as
      #       well, and excluding only the bugprone- spelling leaves it firing
      #       (each alias had to be excluded in turn before the run went clean).
      #   bugprone-easily-swappable-parameters
      #       A design opinion about adjacent same-typed parameters, not a
      #       defect. Acting on it would mean restructuring working signatures.
      #   bugprone-multi-level-implicit-pointer-conversion
      #       Fires on `T **p = realloc(...)`, which is how you grow an array
      #       of pointers in C. Every site is NULL-checked. The suggested
      #       explicit cast would add noise without changing behaviour.
      #   bugprone-implicit-widening-of-multiplication-result
      #       One site: (timeout_ms % 1000) * 1000 assigned to tv_usec. The
      #       modulo bounds the left operand at 999, so the product cannot
      #       exceed 999000 and int arithmetic is exact -- the widening the
      #       check warns about has nothing to truncate.
      - name: clang-tidy
        working-directory: ci/prober
        run: |
          checks='-*,bugprone-*,cert-*,clang-analyzer-*'
          checks="$checks,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling"
          checks="$checks,-cert-err33-c"
          checks="$checks,-bugprone-reserved-identifier,-cert-dcl37-c,-cert-dcl51-cpp"
          checks="$checks,-bugprone-easily-swappable-parameters"
          checks="$checks,-bugprone-multi-level-implicit-pointer-conversion"
          checks="$checks,-bugprone-implicit-widening-of-multiplication-result"

          clang-tidy --quiet \
              --checks="$checks" \
              --warnings-as-errors="$checks" \
              json.c http.c h2.c util.c rules.c assert.c prober.c \
              -- -std=c11 -I.

  # Build-flags + canary gate. DECIDED downgrade of the old "checksec" TODO
  # item (see the reproducible-build/probe-compiles comments above for the
  # same class of downgrade): this repo builds relocatable .o objects that a
  # CONSUMER links into their own .so, never a shared object of its own.
  # RELRO/NX/RPATH/TEXTREL are link-time properties a .o does not have, so a
  # literal checksec here would either pass vacuously (nothing to check) or
  # fail on every object (none of them are linked yet) -- neither result says
  # anything about this repo. Real checksec is a consumer's job, once THEY
  # link a .so; this gate proves only what a .o can prove: the compiler was
  # asked for stack canaries and fortified libc calls, and both requests
  # actually landed in the emitted code.
  #
  # Both flags are baked into ci/prober/build.sh's WARN/CFLAGS rather than added
  # only here, so every local build, the reproducible-build job, and the
  # analyzers job all compile under them too -- a flag that only CI passes is
  # a flag nobody develops against.
  build-flags-canary:
    runs-on: [self-hosted, builder02, lxc]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - name: build with canary + fortify flags
        working-directory: ci/prober
        run: |
          gcc --version | head -1
          ./build.sh

      # __stack_chk_fail is undefined-referenced by any object -fstack-
      # protector-strong instrumented at least one function in -- which, given
      # this codebase's local char arrays (json.c's 64-byte buf, rules.c's
      # 4096-byte line, prober.c's 512-byte req/why buffers, assert.c's
      # 512-byte scratch), is every translation unit. Checked with `nm -A
      # --undefined-only`, the same pattern the banned-libc-function gate
      # above already uses, so a symbol present in .symtab but never CALLED
      # (which -O could in principle strip if it proved no array was ever
      # touched unsafely) does not create a false pass here: an unreferenced
      # canary check would simply not appear as U, and the gate would
      # correctly fail rather than rely on the compiler having left dead code
      # in.
      - name: every prober unit was compiled with a stack canary
        working-directory: ci/prober
        run: |
          fail=0
          for f in json.c http.c h2.c util.c rules.c assert.c prober.c; do
              obj="/tmp/canary-check-$(basename "$f" .c).o"
              gcc -c -O1 -std=c11 -D_FORTIFY_SOURCE=3 -fstack-protector-strong \
                  -o "$obj" "$f"
              if ! nm -A --undefined-only "$obj" | grep -q 'U __stack_chk_fail$'; then
                  echo "$f: no __stack_chk_fail reference -- compiled without" \
                       "a stack canary, or -fstack-protector-strong silently" \
                       "stopped applying" >&2
                  fail=1
              fi
          done
          if [ "$fail" -ne 0 ]; then
              exit 1
          fi

      # _FORTIFY_SOURCE=3 rewrites bounded-length libc calls (memcpy, snprintf,
      # read, ...) to their _chk variant when the compiler can see a
      # destination size at the call site -- which is exactly the case this
      # codebase is in: every buffer above is a local array or a
      # caller-supplied (ptr, len) pair with the size visible at the call.
      # That FORTIFY actually fired is checked the same way as the canary: an
      # undefined reference to a _chk symbol in the object.
      #
      # json.c has NO fortifiable call sites -- its string handling goes through
      # strtol/strchr/memcmp/strtod and (un)bounded local copies whose sizes
      # FORTIFY cannot see, none of which get a _chk variant. A grep for `_chk`
      # on it would therefore either match nothing (an honest report) or be
      # quietly excluded from the check (a vacuous gate dressed up as a pass) --
      # this job takes the first option and documents it here rather than faking
      # coverage the unit does not have. (json.c briefly had a snprintf("%.17g")
      # fortifiable site; the canonical serializer now emits the source lexeme
      # verbatim, so that site is gone and json.c is back in the not-checked
      # camp.)
      #
      # rules.c JOINED THE CHECKED GROUP on 2026-08-28, and the staleness guard
      # below is what caught it. H2-1's parse_alpn() allocates its ALPN encode
      # buffer up front at a size the compiler can see, so the single
      # `memcpy(buf + len, p, n)` at rules.c:369 now qualifies and FORTIFY
      # rewrites it to __memcpy_chk. That is a strengthening, not a regression:
      # the file went from having nothing to fortify to having a fortified
      # bounded copy, so it belongs in the positive check above rather than in
      # the not-checked list. This is the second time that guard has moved a
      # file between the two groups (json.c was the first); leave it in place.
      - name: fortifiable call sites were rewritten to their _chk form
        working-directory: ci/prober
        run: |
          fail=0
          for f in http.c util.c assert.c prober.c rules.c; do
              obj="/tmp/canary-check-$(basename "$f" .c).o"
              hits=$(nm -A --undefined-only "$obj" | awk '$3 ~ /_chk$/ {print $3}' | sort -u)
              if [ -z "$hits" ]; then
                  echo "$f: no _chk symbol reference -- _FORTIFY_SOURCE=3 did" \
                       "not rewrite any call, though this file has bounded-copy" \
                       "call sites (memcpy/snprintf/read) that should have" \
                       "qualified" >&2
                  fail=1
              else
                  echo "$f: $hits"
              fi
          done
          # json.c is deliberately NOT checked for _chk symbols -- see the step
          # comment above. Confirm that absence is still true rather than
          # silently trusting a comment that could go stale. (rules.c was in
          # this list until 2026-08-28, when this very guard caught it acquiring
          # a fortifiable site and moved it to the checked loop above.)
          for f in json.c; do
              obj="/tmp/canary-check-$(basename "$f" .c).o"
              hits=$(nm -A --undefined-only "$obj" | awk '$3 ~ /_chk$/ {print $3}')
              if [ -n "$hits" ]; then
                  echo "$f: now has fortifiable call sites ($hits) -- the" \
                       "step comment claiming otherwise is stale and this job" \
                       "should start checking $f too" >&2
                  fail=1
              fi
          done
          if [ "$fail" -ne 0 ]; then
              exit 1
          fi

  locale-hostility:
    runs-on: [self-hosted, builder02, lxc]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - name: generate the hostile locales
        run: |
          # tr_TR for the dotless-i case-folding hazard; de_DE for the
          # comma-decimal LC_NUMERIC hazard (JSON numbers must still read '.').
          #
          # Built with localedef straight from the charmap sources rather than
          # by appending to /etc/locale.gen + locale-gen. On this self-hosted
          # LXC runner that append is silently ignored: locale-gen regenerated
          # only the pre-existing en_* set and reported "Generation complete",
          # so the gate below failed with tr_TR absent. localedef does not
          # consult /etc/locale.gen at all, so it cannot be no-opped that way.
          # The locale SOURCES (/usr/share/i18n/locales) come from the `locales`
          # package -- absent on a minimal image, which is the underlying gap.
          if [ ! -f /usr/share/i18n/locales/tr_TR ]; then
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends locales
          fi
          for l in tr_TR de_DE; do
              sudo localedef -i "$l" -f UTF-8 "/usr/lib/locale/${l}.utf8"
          done
          # Fail here, not three steps later as a confusing test failure, if
          # generation did not actually register the locales.
          for l in tr_TR de_DE; do
              locale -a | grep -qi "^${l}\.utf8$" || {
                  echo "$l locale was not generated -- locale -a:" >&2
                  locale -a >&2
                  exit 1
              }
          done

      - name: build
        working-directory: ci/prober
        run: ./build.sh

      # test.sh no longer includes http_locale_check.c in its *_test.c
      # discovery (it is named http_locale_check.c specifically to opt out),
      # so this run is the ordinary C-locale-agnostic self-test suite -- it
      # must still pass under tr_TR for anything that does NOT touch
      # locale-sensitive comparisons, which is everything except
      # http_has_header.
      - name: self-tests under LC_ALL=tr_TR.UTF-8
        working-directory: ci/prober
        env:
          LC_ALL: tr_TR.UTF-8
        run: |
          locale
          ./test.sh

      # Comma-decimal locale: JSON numbers must still parse with '.' as the
      # radix. json_test parses fractional numbers ("1.5", "1E-007", ...); with
      # a plain locale-honoring strtod() they would be rejected as "malformed
      # number" under de_DE, so json_strtod()'s C-locale pin is what keeps this
      # green. Mutation proof: reverting json_strtod() back to plain strtod() in
      # json.c fails THIS step while every non-locale job stays green -- the
      # signature invisible-to-ordinary-CI shape of a locale bug (verified by
      # hand before this PR).
      - name: self-tests under LC_ALL=de_DE.UTF-8 (comma-decimal)
        working-directory: ci/prober
        env:
          LC_ALL: de_DE.UTF-8
        run: |
          locale
          ./test.sh

      # Mutation proof that this leg is not vacuous: http_locale_check.c
      # asserts an all-lowercase needle matches an all-caps 'I'-leading
      # header (and the reverse) via http_has_header(). Reverting the
      # ascii_case_eq() fix in http.c back to strncasecmp() makes this step
      # fail under tr_TR.UTF-8 while every OTHER job in this workflow (which
      # never sets LC_ALL) stays green -- verified by hand before this PR,
      # which is exactly the failure mode a locale bug has: invisible to any
      # CI leg that does not deliberately set a hostile locale.
      - name: dedicated Turkish-i regression case
        working-directory: ci/prober
        env:
          LC_ALL: tr_TR.UTF-8
          CC: gcc
        run: |
          WARN="-Wall -Wextra -Werror -Wconversion -Wsign-conversion -Wshadow"
          WARN="$WARN -Wvla -Wformat=2 -Wwrite-strings -Wcast-qual"
          WARN="$WARN -Wpointer-arith -Wdeclaration-after-statement"
          # This link line is a hand-maintained duplicate of the one build.sh
          # derives, and it drifts whenever a LIB unit takes a new dependency:
          # http.c already needed -lz, and the TLS transport leg made -lssl
          # -lcrypto load-bearing too (OpenSSL is in any case an unconditional
          # dependency of every prober binary -- see build.sh's LDFLAGS, which
          # links it for the body_sha256 oracle). Keep in sync with build.sh.
          # shellcheck disable=SC2086
          gcc -O1 -g -std=c11 $WARN -D_FORTIFY_SOURCE=3 -fstack-protector-strong \
              -o /tmp/http_locale_check http_locale_check.c http.c json.c \
              util.c -lz -lssl -lcrypto
          /tmp/http_locale_check

  # License-header gate: all .c and .h files must carry BSD-2-Clause SPDX
  # identifier (project policy for nginx modules).
  license-headers:
    runs-on: [self-hosted, builder02, lxc]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - name: every .c and .h carries BSD-2-Clause header
        run: |
          missing_header=0
          for f in $(git ls-files | grep -E '\.(c|h)$'); do
              if ! head -3 "$f" | grep -q "SPDX-License-Identifier: BSD-2-Clause"; then
                  echo "missing BSD-2-Clause header: $f" >&2
                  missing_header=1
              fi
          done
          if [ "$missing_header" -eq 1 ]; then
              echo "All .c and .h files must include SPDX-License-Identifier: BSD-2-Clause header." >&2
              exit 1
          fi
