name: arch-32bit

# Scheduled + workflow_dispatch, same tradeoff as s390x-endian.yml and
# codeql.yml: this leg installs a whole i386 cross-toolchain (dpkg
# --add-architecture i386 + apt update + multilib + :i386 -dev packages)
# every run, which is minutes of apt on top of the build -- disproportionate
# on the blocking PR path where every other gate costs seconds. Moved off the
# PR path 2026-07-26 to cut PR wall-clock and queue pressure on the builder02
# fleet; the width-bug coverage it provides is real but not PR-urgent (a
# 32-bit VALUE truncation is not introduced by a typical parser/harness diff
# any faster than the weekly cadence catches it). Off-hour minute, staggered
# against s390x-endian.yml's 43 5 * * 2 and codeql.yml's 17 4 * * 1 so the
# scheduled workflows do not queue at the same instant.
#
# What this catches: size_t/off_t/time_t are 4 bytes under -m32 where they are
# 8 on the amd64 build the rest of CI runs; a truncation or a format-width bug
# (%zu against something that is not actually a size_t on this ABI, a length
# computation that overflows 32 bits where it would not overflow 64) is
# invisible on every other job in CI and would only ever surface on a 32-bit
# consumer host. Building AND RUNNING the unit tests under -m32 is what catches
# it: a build-only leg would miss a wrong runtime VALUE that still compiles and
# links clean (the atoi() truncation PR #19 found). Distinct from
# s390x-endian.yml, which targets big-endian + unsigned-char, NOT type width.
on:
  schedule:
    # 51 minutes past 5am UTC Wednesday -- off-hour, a day away from
    # s390x-endian.yml (Tuesday 05:43) and codeql.yml (Monday 04:17).
    - cron: '51 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The warning wall stays on, unchanged from build.sh -- a 32-bit build that
  # only passes with the strict flags loosened would be hiding exactly the
  # class of bug this leg exists to catch.
  build-32bit:
    runs-on: [self-hosted, builder02, lxc]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - name: install 32-bit toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-multilib libc6-dev-i386 libssl-dev:i386 zlib1g-dev:i386

      - name: build the prober + self-tests as 32-bit
        working-directory: ci/prober
        env:
          CC: "gcc -m32"
        run: |
          gcc --version | head -1
          ./build.sh

      # test.sh discovers and runs every *_test.c binary it just built --
      # exactly the mechanism the plain-arch selftest job uses, just under
      # -m32. A build-only leg would not have caught the atoi() bug PR #19
      # found; running is what proves a wrong VALUE, not just a wrong TYPE
      # that still happens to compile.
      - name: run the 32-bit self-tests
        working-directory: ci/prober
        env:
          CC: "gcc -m32"
        run: ./test.sh

      # Confirm the binary is actually 32-bit rather than the -m32 flag having
      # been silently ignored (e.g. a toolchain that lacks the 32-bit runtime
      # and falls back). `file` reports the ELF class directly.
      - name: the built binary is ELF32
        working-directory: ci/prober
        run: |
          file prober | grep -q 'ELF 32-bit' || {
              echo "prober is not ELF 32-bit -- the -m32 build did not" \
                   "actually produce a 32-bit binary:" >&2
              file prober >&2
              exit 1
          }
