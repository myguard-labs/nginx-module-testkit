@LOAD@
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 32; }
http {
    @PROBE_ZONE@
    server {
        listen 127.0.0.1:@PORT@;

        # keepalive is load-bearing here (unlike property-fuzz): the stateful
        # generator draws PIPELINE steps that issue several requests down ONE
        # connection, so the connection must not be closed after the first.
        keepalive_requests 1000;
        keepalive_timeout  30s;

        # Generous, same reasoning as property-fuzz: the corpus carries an
        # oversize header value, and a 400 at header-parse time would
        # short-circuit before the request-path teardown this property tests.
        large_client_header_buffers 16 64k;

        # The backend leg (route == backend). Faults fire against a memcached
        # get keyed by occurrence, in ./backend. No upstream keepalive: each
        # generated request opens its own upstream connection, so a failed
        # request cannot poison a pooled connection for the next.
        location /mc {
            set $memcached_key $arg_key;
            memcached_pass 127.0.0.1:@BACKEND_PORT@;
            memcached_read_timeout 1s;
            error_page 404      = @miss;
            error_page 502 504  = @gone;
        }
        location @miss { return 404 "MISS\n"; }
        location @gone { return 200 "GONE\n"; }

        # The general fuzz leg: whatever the corpus fragment's request line asks
        # for lands here.
        location / { return 200 "OK\n"; }

        location /__probe { @PROBE@ }
    }
}
