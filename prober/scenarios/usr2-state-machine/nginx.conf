@LOAD@
# A USR2 binary upgrade execs a NEW master via ngx_exec_new_binary, which passes
# only nginx's inherited (whitelisted) environment and drops ASAN_OPTIONS. Under
# the sanitizer leg the new master reloads the dynamic module WITHOUT
# detect_odr_violation=0 and aborts on the ngx_module_names ODR violation, so
# USR2 "forks no new master" and this scenario fails. Propagate both across the
# exec; UBSAN_OPTIONS is dropped the same way (the new master would lose
# halt_on_error=1 and a UBSan violation would print but not abort, masking the
# finding). Both are unset (harmless) on non-sanitizer legs.
env ASAN_OPTIONS;
env UBSAN_OPTIONS;
# daemon ON, not off: USR2 is IGNORED under daemon off (see the header comment
# above and this scenario's env). The PROBER_DAEMON_MODE=on opt-in lets the
# harness track the daemonized master by its pidfile so the upgrade path is
# reachable at all.
daemon on;
# The pidfile MUST be at this exact path: with daemon on the master is not $!,
# so prober_boot adopts the master pid from this file and teardown kills it from
# here. prober_check_conf bails if the opt-in is set and this path is not written.
# This file is also THE observable this scenario is built on: on USR2 the old
# master RENAMES it to nginx.pid.oldbin and the new master writes a fresh
# nginx.pid; on the old master's exit .oldbin disappears again.
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    @PROBE_ZONE@
    # No upstream: this scenario's subject is the master-generation state
    # machine (pidfile hand-off, .oldbin lifecycle, the inherited listen socket
    # surviving the old master's death), not any module-held upstream state --
    # that reconnect proof is backend-usr2-keepalive's job. A bare 200 is all
    # the listen-socket-continuity oracle needs.
    server {
        listen 127.0.0.1:@PORT@;
        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
