@LOAD@
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    @PROBE_ZONE@

    # A keepalive-enabled memcached upstream: the parked-connection pool is where
    # the interesting cleanup lives. Each named fault forces a different upstream
    # error branch (reset, short read, over/under-count, drip-timeout, idle
    # close), and after each the module must return the request pool AND the
    # upstream connection to the state a clean request would leave -- which the
    # driver reads as fd + cycle-pool neutrality.
    upstream mc {
        server 127.0.0.1:@BACKEND_PORT@;
        keepalive 4;
    }

    server {
        listen 127.0.0.1:@PORT@;

        # memcached_read_timeout applies BETWEEN successive reads, not to the
        # whole response (nginx docs, ngx_http_memcached_module) -- so it must
        # sit strictly between the drip row's INTER-CHUNK gap and its TOTAL
        # transfer time, or neither the overcount nor the drip row can reach
        # the timeout/error branch their matrix.tsv row claims:
        #   - lie_bytes overcount leaves the client waiting on bytes that never
        #     come at all, so any timeout > 0 catches it.
        #   - drip (bytes=4 ms=50 against a ~64-byte VALUE/END reply) sends a
        #     real chunk every 50ms and completes in ~800ms if never
        #     interrupted -- a timeout >= 800ms lets it finish as an ordinary
        #     slow-but-complete transfer, never hitting the read-timeout
        #     finalize path. 200ms is comfortably above the 50ms cadence (no
        #     false timeout between legitimate chunks) and comfortably below
        #     the ~800ms total, so the read genuinely stalls out mid-drip.
        location /mc {
            set $memcached_key $arg_key;
            memcached_pass mc;
            memcached_read_timeout 200ms;
            error_page 404 502 504 = @err;
        }
        location @err { return 200 "ERR\n"; }

        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
