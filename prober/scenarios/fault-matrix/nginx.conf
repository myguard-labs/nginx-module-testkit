@LOAD@
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    @PROBE_ZONE@

    # A keepalive-enabled memcached upstream: the parked-connection pool is where
    # the interesting cleanup lives. Each named fault forces a different upstream
    # error branch (reset, short read, over/under-count, drip-timeout, idle
    # close), and after each the module must return the request pool AND the
    # upstream connection to the state a clean request would leave -- which the
    # driver reads as fd + cycle-pool neutrality.
    upstream mc {
        server 127.0.0.1:@BACKEND_PORT@;
        keepalive 4;
    }

    server {
        listen 127.0.0.1:@PORT@;

        # A short read timeout bounds the two faults that leave the client
        # waiting on bytes that never come (lie_bytes overcount, drip): without
        # it the request blocks until the whole-response deadline and the row
        # takes seconds. 1s is far above the drip's 50ms cadence yet caps the
        # overcount wait.
        location /mc {
            set $memcached_key $arg_key;
            memcached_pass mc;
            memcached_read_timeout 1s;
            error_page 404 502 504 = @err;
        }
        location @err { return 200 "ERR\n"; }

        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
