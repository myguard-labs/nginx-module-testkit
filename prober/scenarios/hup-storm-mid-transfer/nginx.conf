@LOAD@
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    @PROBE_ZONE@
    server {
        listen 127.0.0.1:@PORT@;

        # Same shape as backend-reload-inflight: driven through nginx's own
        # memcached client, with the drip fault on the fake upstream being what
        # keeps the response in flight across every reload in the storm.
        location /mc {
            set $memcached_key $arg_key;
            memcached_pass 127.0.0.1:@BACKEND_PORT@;
            error_page 404 = @miss;
        }
        location @miss { return 404 "MISS\n"; }

        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
