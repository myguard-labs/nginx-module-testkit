@LOAD@
# A USR2 binary upgrade execs a NEW master via ngx_exec_new_binary, which passes
# only nginx's own inherited environment -- and nginx keeps just its whitelisted
# vars, dropping ASAN_OPTIONS. Under the sanitizer leg the new master then reloads
# the dynamic module WITHOUT detect_odr_violation=0 and aborts on the ngx_module_names
# ODR violation, so USR2 "forks no new master" and this scenario fails. `env
# ASAN_OPTIONS;` propagates it across the upgrade. Harmless on non-sanitizer legs:
# prober_heap_env exports ASAN_OPTIONS unconditionally and a non-ASan binary ignores it.
# UBSAN_OPTIONS is dropped across the same exec, so the new master would lose
# halt_on_error=1 and a UBSan violation in it would print but not abort, masking
# the finding. Propagate it too. Both are unset (harmless) on non-sanitizer legs.
env ASAN_OPTIONS;
env UBSAN_OPTIONS;
# daemon ON, not off: a USR2 binary upgrade is IGNORED under daemon off. nginx's
# ngx_signal_handler drops NGX_CHANGEBIN when getppid()==ngx_parent, which always
# holds for a foregrounded (daemon off) master whose parent is prober_boot's `&`
# launcher -- the master then logs "the changing binary signal is ignored", no
# .oldbin appears and no new master forks. The PROBER_DAEMON_MODE=on opt-in in
# this scenario's env lets the harness track a daemonized master by its pidfile
# instead of by $!, so the upgrade path is reachable at all.
daemon on;
# The pidfile MUST be at this exact path: with daemon on the master is not $!,
# so prober_boot adopts the master pid from this file and teardown kills it from
# here. prober_check_conf bails if the opt-in is set and this path is not written.
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    @PROBE_ZONE@

    server {
        listen 127.0.0.1:@PORT@;

        # Driven through nginx's own memcached client. The drip fault on the
        # upstream is what keeps the response in flight across the USR2 exec.
        location /mc {
            set $memcached_key $arg_key;
            memcached_pass 127.0.0.1:@BACKEND_PORT@;
            error_page 404 = @miss;
        }
        location @miss { return 404 "MISS\n"; }

        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
