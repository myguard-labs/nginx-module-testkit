@LOAD@
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
# Room for the background load loop's connections plus the probe/warm requests
# to overlap a reload without the worker refusing accept -- a refused window
# would be measured as load, not as the reload behaviour under test.
events { worker_connections 64; }
http {
    @PROBE_ZONE@
    server {
        listen 127.0.0.1:@PORT@;

        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
