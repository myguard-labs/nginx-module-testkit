@LOAD@
# Scenario: zone names containing special characters (quote, backslash,
# control char) must be properly JSON-escaped in the probe document.
#
# @PROBE_ZONE@ is this scenario's env file setting PROBER_PROBE_ZONE to a
# `test_ref_zone <name> <size>;` directive whose name is an nginx-conf
# double-quoted string containing those characters -- see env for exactly
# which ones and why. This makes zone.present true and zone.name the real,
# attacker-controlled-shaped name, so the probe's escaping is genuinely
# exercised, not merely rendered against an absent zone.
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    @PROBE_ZONE@

    server {
        listen 127.0.0.1:@PORT@;

        root @PREFIX@/www;

        location / {
            return 200 "OK";
        }

        location /__probe { @PROBE@ }
    }
}
