@LOAD@
# Scenario: zone names containing special characters (quotes, backslashes, etc.)
# must be properly JSON-escaped in the probe document.
#
# This test ensures that zone.name field renders with correct JSON escaping
# so that a zone named something like 'test"zone' or 'test\zone' produces
# valid JSON that round-trips through parsing correctly.
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    @PROBE_ZONE@

    server {
        listen 127.0.0.1:@PORT@;

        root @PREFIX@/www;

        location / {
            return 200 "OK";
        }

        location /__probe { @PROBE@ }
    }
}
