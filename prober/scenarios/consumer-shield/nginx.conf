@LOAD@
# CONSUMER MODULE under test: nginx-http-shield-module, built into the same
# objs/ dir as the ref probe (zero-hook consumer, shield equivalent of
# consumer-cache-turbo / grind item H3). @LOAD@ above load_modules the probe;
# @BUILD_OBJS@ resolves to that objs/ dir so this scenario loads the second,
# consumer .so itself -- same shape as consumer-cache-turbo's load. On a tree
# lacking the .so, ./requires has already SKIPped the scenario, so this line
# is only reached where it exists.
load_module @BUILD_OBJS@/ngx_http_shield_module.so;
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    @PROBE_ZONE@

    # shield_ban_zone is shm, allocated once at config-parse/init time -- same
    # "must not show up as a per-request delta" property as cache-turbo's
    # cache_turbo_zone. This scenario's zero-hook oracles never touch it
    # directly (no shield_probe zone rendering here); it exists only so the
    # `shield block` + `shield_ban` directives below have somewhere to record
    # state, exercising the module's real per-request ban-tracking path.
    shield_ban_zone szone:1m;

    server {
        listen 127.0.0.1:@PORT@;

        # Upstream 127.0.0.1:1 -- nothing listens there, so a request that
        # PASSES the shield's PRECONTENT check returns 502 (proxy_pass fails
        # to connect) and a request the shield BLOCKS returns 403 before
        # proxy_pass ever runs. Same asymmetry idiom as the module's own
        # t/prober/conf/prober.conf.
        location /guarded {
            shield block;
            proxy_pass http://127.0.0.1:1;
        }

        location / {
            shield detect;
            proxy_pass http://127.0.0.1:1;
        }

        location /__probe { @PROBE@ }
    }
}
