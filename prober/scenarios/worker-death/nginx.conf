@LOAD@
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
# One worker: the pid oracle (and this scenario's kill target) require exactly
# one, so the worker answering the probe is unambiguously the one we SIGKILL.
events { worker_connections 64; }
http {
    @PROBE_ZONE@
    server {
        listen 127.0.0.1:@PORT@;

        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
