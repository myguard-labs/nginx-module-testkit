@LOAD@
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;

# SHORT on purpose: this is the timer under test. It is a MAIN-context-only
# directive (not valid inside `http {}` -- verified: nginx rejects it there
# with "directive is not allowed here"). 2s is long enough that the close is
# unambiguously the timeout firing (not instant, not a coincidence of
# scheduling), yet short enough the scenario stays fast. The settle window
# the driver polls for the force-close (see driver.sh) must comfortably
# exceed this value.
worker_shutdown_timeout 2s;

events { worker_connections 16; }
http {
    @PROBE_ZONE@

    # CRITICAL: set far longer than worker_shutdown_timeout and far longer
    # than the driver's settle window, so the negative control's stalled
    # body is NEVER closed by the ordinary body-read timer -- only
    # worker_shutdown_timeout (which only fires during a graceful shutdown)
    # can close the stalled connection under test. This is what makes the
    # close oracle in driver.sh attributable to the reload+timeout, not to
    # an unrelated timer.
    client_body_timeout 3600s;

    server {
        listen 127.0.0.1:@PORT@;

        # Mirrors reload-mid-upload/nginx.conf's mechanism (see its header
        # comment): a bare `return 200` does NOT read the request body (it
        # fires in the rewrite phase and short-circuits before any body
        # read), which would make a stalled-body scenario vacuous. proxy_pass
        # with proxy_request_buffering on (the default) forces nginx to
        # buffer the WHOLE body before it can open the upstream connection
        # and produce a response -- so a body that never completes leaves
        # the request genuinely stalled, mid-read, inside nginx.
        location /upload {
            client_max_body_size 10m;
            proxy_pass http://127.0.0.1:@PORT@/sink;
        }
        location /sink { return 200 "UPLOADED\n"; }

        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
