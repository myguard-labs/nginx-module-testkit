@LOAD@
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    @PROBE_ZONE@

    server {
        listen 127.0.0.1:@PORT@;

        # The differential surface: fixed, deterministic content. Both the
        # CONTROL boot and the CANDIDATE boot render this SAME template (D-2:
        # one conf, not two) -- driver.sh boots it twice, sequentially, and the
        # "candidate" side is whichever mutate.sh row has patched THIS FILE's
        # /canary block or driver.sh's own request plan before the second
        # (candidate) boot. On an unpatched tree candidate == control by
        # construction, which is the NULL canary the default run must produce.
        location /canary {
            add_header X-Canary-Build "stable" always;
            return 200 "canary-stable-payload\n";
        }

        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
