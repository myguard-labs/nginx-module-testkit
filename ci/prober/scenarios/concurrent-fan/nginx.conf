@LOAD@
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;

events {
    worker_connections 64;

    # One listen-socket wakeup accepts the whole backlog rather than one
    # connection per event. Without it the worker can still be draining the
    # accept queue when the after-probe is taken, so a fan of N would read as
    # fewer than N accepted connections and the deltas would describe a
    # half-arrived fan instead of a complete one. README documents this as the
    # required setting for `concurrent`.
    multi_accept on;
}

http {
    @PROBE_ZONE@
    server {
        listen 127.0.0.1:@PORT@;

        # Generous on purpose, for the same reason conn-delta is: a timeout
        # firing would reclaim connections by its own path and the deltas would
        # come out clean without the fan's teardown ever being exercised.
        client_header_timeout 60s;
        client_body_timeout   60s;
        keepalive_timeout     60s;

        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
