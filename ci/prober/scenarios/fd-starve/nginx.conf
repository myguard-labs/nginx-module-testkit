@LOAD@
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;

# worker_rlimit_nofile is nginx's own setrlimit(RLIMIT_NOFILE, ...) call
# (ngx_worker_process_init), so the process-level fd ceiling this scenario
# needs is deterministic and self-contained here -- no shell `ulimit -n` in an
# `env` file, and no dependency on whatever descriptor limit the host or CI
# runner happens to inherit into the launching shell.
#
# Pinned WELL BELOW worker_connections (see events{} below) on purpose: the
# two ceilings are different resources (nginx docs, Connection Processing --
# worker_connections bounds per-worker CONNECTION OBJECTS, including upstream
# and keepalive slots, while RLIMIT_NOFILE is the kernel's per-process
# descriptor table, EMFILE's source per accept(2)/open(2)), and this scenario
# exists specifically to isolate the fd ceiling from the connection-slot
# ceiling `scenarios/open-conns` already covers. If worker_connections sat at
# or below worker_rlimit_nofile, driver.sh's held connections would exhaust
# the connection-slot accounting FIRST and nginx would refuse them with its
# own "connection limit" bookkeeping -- accept() would still succeed, no
# EMFILE would ever fire, and the scenario would silently degrade into a copy
# of open-conns while still claiming to test fd exhaustion.
worker_rlimit_nofile 30;

events {
    worker_connections 1000;
    multi_accept on;
}

http {
    @PROBE_ZONE@
    server {
        listen 127.0.0.1:@PORT@;

        # Generous timeouts: driver.sh's held connections are bare and unread
        # by design (the same open_conns shape scenarios/open-conns uses), and
        # a timeout reaping one before the EMFILE witness fires would return
        # its descriptor on its own and could mask the pressure this scenario
        # exists to apply.
        client_header_timeout 60s;
        client_body_timeout   60s;
        keepalive_timeout     60s;

        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
