@LOAD@
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 100; }
http {
    @PROBE_ZONE@
    server {
        listen 127.0.0.1:@PORT@;
        location / { return 200 "OK\n"; }
        # A request here logs an [error] line naming the failed open(), which
        # gives the grep_error_log half of this scenario a line the server
        # genuinely writes DURING the case. At `info` level nginx logs nothing
        # per successful request, so a healthy request has no slice to grep.
        location /gone { root @PREFIX@/nonexistent; }
        location /__probe { @PROBE@ }
    }
}
