@LOAD@
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    @PROBE_ZONE@
    server {
        listen 127.0.0.1:@PORT@;

        # memcached_read_timeout applies BETWEEN successive reads, not to the
        # whole response (ngx_http_memcached_module docs) -- same discipline as
        # fault-matrix's nginx.conf. Pinned to a fixed, documented value so the
        # drip pacing in ./backend can be sized to deterministically CROSS it:
        # a wider gap between two dripped chunks than this timeout forces
        # nginx's own upstream read to time out mid-transfer, which is the
        # upstream fault this scenario needs -- see ./backend and driver.sh.
        location /mc {
            set $memcached_key $arg_key;
            memcached_pass 127.0.0.1:@BACKEND_PORT@;
            memcached_read_timeout 150ms;
            error_page 404 = @miss;
        }
        location @miss { return 404 "MISS\n"; }

        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
