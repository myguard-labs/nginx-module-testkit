@LOAD@
# CONSUMER MODULE under test: the http-zstd response-body filter, built into the
# same objs/ dir as the ref probe. @LOAD@ above load_modules the probe;
# @BUILD_OBJS@ resolves to that objs/ dir so this scenario can load the second,
# consumer .so itself. This is the whole reason @BUILD_OBJS@ exists (see lib.sh):
# the harness stays generic -- it only ships the probe -- and a consumer scenario
# names its own module here. On a tree that lacks the .so the `requires` gate
# has already SKIPped the scenario, so this line is only reached where it exists.
load_module @BUILD_OBJS@/ngx_http_zstd_filter_module.so;
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    @PROBE_ZONE@

    # zstd is level-agnostic to the point of this scenario (ctx/dict lifetime vs
    # old-cycle free), but a fixed level keeps the compressed bytes deterministic
    # across runs so the neg-control's "corrupt one byte" mutation is stable.
    zstd on;
    zstd_comp_level 6;
    # memcached upstream replies carry no content type of their own; the location
    # sets default_type text/plain, and this list must name it or the filter
    # skips (defaults are text/html only). Body is 172 B, so min_length must be
    # below that or the known-Content-Length guard skips compression outright.
    zstd_types text/plain;
    zstd_min_length 1;

    server {
        listen 127.0.0.1:@PORT@;

        # Same drip-through-memcached shape as hup-storm-mid-transfer: nginx's
        # own memcached client fetches the seeded value from the fake upstream,
        # which DRIPS it 2 bytes at a time. Because the value arrives in small
        # pieces, the zstd body filter is invoked repeatedly on one response and
        # holds a live ZSTD_CCtx (registered on r->pool cleanup) across the whole
        # transfer -- so a SIGHUP delivered now lands with a compression context
        # genuinely mid-stream, which is exactly what this scenario exercises.
        location /mc {
            default_type text/plain;
            set $memcached_key $arg_key;
            memcached_pass 127.0.0.1:@BACKEND_PORT@;
            error_page 404 = @miss;
        }
        location @miss { default_type text/plain; return 404 "MISS\n"; }

        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
