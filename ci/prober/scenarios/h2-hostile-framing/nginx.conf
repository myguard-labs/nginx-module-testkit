@LOAD@
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    @PROBE_ZONE@
    server {
        # PLAIN listener, no `ssl` -- this scenario's whole point is hostile
        # h2 FRAMING, which is orthogonal to how the connection got upgraded
        # to h2 in the first place. h2-roundtrip already proves the TLS/ALPN
        # leg (H2-1/H2-2); driving that same handshake here a second time
        # would buy nothing and would force driver.sh to speak TLS from raw
        # python sockets for no reason the attack rows need.
        #
        # `http2 on;` on a listener with no `ssl` is nginx's h2c "prior
        # knowledge" mode (nginx 1.25.1+, RFC 9113 SS3.4): a connection that
        # opens with the literal client preface "PRI * HTTP/2.0\r\n\r\n
        # SM\r\n\r\n" is read as h2 from byte 0, no Upgrade dance, no ALPN.
        # driver.sh's attacks send exactly that preface before each hostile
        # frame, which is what lets this listener carry them at all.
        listen 127.0.0.1:@PORT@;
        http2 on;

        location / { return 200 "OK\n"; }

        location /__probe { @PROBE@ }
    }
}
