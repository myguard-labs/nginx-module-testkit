@LOAD@
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    sendfile off;
    @PROBE_ZONE@
    log_format h2_lifecycle '$uri|$body_bytes_sent';
    access_log @PREFIX@/logs/h2-lifecycle.log h2_lifecycle;

    server {
        # Prior-knowledge h2c keeps this scenario about stream lifecycle and
        # cleanup.  TLS/ALPN is already owned by h2-roundtrip.
        listen 127.0.0.1:@PORT@;
        http2 on;

        # driver.sh creates this 256 KiB fixture after boot.  It exceeds the
        # default per-stream flow-control window, so both streams are proven
        # active before either response can finish.
        location = /cancel.bin { alias @PREFIX@/payload.bin; }
        location = /survive.bin { alias @PREFIX@/payload.bin; }
        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
