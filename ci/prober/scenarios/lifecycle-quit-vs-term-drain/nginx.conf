@LOAD@
daemon on;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log notice;
worker_processes 1;

# LONG on purpose -- the opposite framing of reload-worker-shutdown-timeout's
# SHORT timer. This scenario is not about the shutdown timer firing; it is
# about the graceful path (QUIT) waiting for genuinely in-flight work to
# finish before it ever needs that timer at all. A short timeout here would
# race the drip and could force-close the QUIT leg's own request, collapsing
# the very contrast the scenario exists to show. Long enough that a 2s drip
# finishes with room to spare, never exercised by either signal.
worker_shutdown_timeout 30s;

events { worker_connections 16; }
http {
    @PROBE_ZONE@

    # A bare `return 200` fires in the rewrite phase and never reads the
    # request body, which would make a "drain the in-flight request" claim
    # vacuous -- the same trap reload-mid-upload's own header documents at
    # length. reload-mid-upload and reload-worker-shutdown-timeout close that
    # gap with proxy_pass to a same-server /sink location, but that idiom
    # does NOT survive here: QUIT's own handler closes every listening
    # socket for this worker (ngx_process_cycle.c, "gracefully shutting
    # down") BEFORE it waits for in-flight connections to drain, so a
    # proxy_pass aimed back at @PORT@ needs a brand-new connection the
    # draining worker can no longer accept -- even to itself -- and the
    # request dies with a 502 instead of proving anything about draining.
    # (Empirically confirmed while developing this scenario: the exact 502
    # this comment describes is what a proxy_pass-to-self version produced.)
    #
    # `mirror` + `mirror_request_body on` reads the whole body through an
    # INTERNAL subrequest -- no second TCP connection, so it is unaffected by
    # the listening sockets already being closed -- and, like proxy_pass
    # buffering, the main request cannot finish until that read completes.
    # A body that finishes shortly after QUIT is sent therefore still proves
    # the draining worker kept reading past the signal; a body that finishes
    # shortly after TERM (this scenario's negative leg) would prove the
    # opposite failed to hold.
    server {
        listen 127.0.0.1:@PORT@;

        location /upload {
            client_max_body_size 10m;
            mirror /drain;
            mirror_request_body on;
            return 200 "UPLOADED\n";
        }
        location /drain { internal; return 200; }

        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
