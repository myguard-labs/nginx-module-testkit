@LOAD@
daemon on;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log notice;
worker_processes 1;

# LONG on purpose -- the opposite framing of reload-worker-shutdown-timeout's
# SHORT timer. This scenario is not about the shutdown timer firing; it is
# about the graceful path (QUIT) waiting for genuinely in-flight work to
# finish before it ever needs that timer at all. A short timeout here would
# race the drip and could force-close the QUIT leg's own request, collapsing
# the very contrast the scenario exists to show. Long enough that a 2s drip
# finishes with room to spare, never exercised by either signal.
worker_shutdown_timeout 30s;

events { worker_connections 16; }
http {
    @PROBE_ZONE@

    # A bare `return 200` fires in the rewrite phase and never reads the
    # request body, which would make a "drain the in-flight request" claim
    # vacuous. Verified from source, not assumed: ngx_http_script_return_code()
    # (http/ngx_http_script.c:1571-1588) calls ngx_http_send_response(), which
    # at http/ngx_http_core_module.c:1804 calls ngx_http_discard_request_body()
    # -- that returns NGX_OK immediately after arming an ASYNC discard, it does
    # not read to completion -- then sends the response.
    # ngx_http_core_rewrite_phase() (http/ngx_http_core_module.c:946-968) then
    # calls ngx_http_finalize_request() on that non-DECLINED return, so the
    # phase engine stops there and any later-phase handler never runs.
    #
    # `mirror` + `mirror_request_body on` does NOT rescue that, and an earlier
    # revision of this file wrongly combined it with `return`. `mirror`
    # installs its handler in NGX_HTTP_PRECONTENT_PHASE, which is strictly
    # LATER than NGX_HTTP_REWRITE_PHASE where `return` already finalized the
    # request (same two source locations above) -- so the mirror handler never
    # ran and assertions 2, 6 and 8 were vacuous the whole time `return` sat in
    # front of it.
    #
    # proxy_pass with proxy_request_buffering on (the default) is the
    # mechanism that actually reads the body first: ngx_http_proxy_handler
    # (http/modules/ngx_http_proxy_module.c:976) calls
    # ngx_http_read_client_request_body(r, ngx_http_upstream_init) and returns
    # NGX_DONE, so the ENTIRE body is read before any upstream connect is even
    # attempted -- the same property reload-mid-upload and lifecycle-usr1-reopen
    # already rely on.
    #
    # But proxy_pass aimed back at THIS server (@PORT@, or any second listener
    # in this same nginx.conf, including a unix socket) does not survive QUIT
    # here: QUIT's own handler closes every listening socket for this worker
    # (ngx_close_listening_sockets(), os/unix/ngx_process_cycle.c:728-740,
    # which iterates and closes every entry of THIS cycle's cycle->listening,
    # core/ngx_connection.c:1128ff -- AF_UNIX included) BEFORE it waits for
    # in-flight connections to drain, so a self-proxy needs a brand-new
    # connection the draining worker can no longer accept -- even to itself --
    # and the request dies with a 502 instead of proving anything about
    # draining. (Empirically confirmed while developing this scenario: the
    # exact 502 this comment describes is what a proxy_pass-to-self version
    # produced.)
    #
    # The fix used below is proxy_pass to the testkit's OWN fake upstream
    # (fakesrv, started by prober_backend_start via the `backend` script next
    # to this file, published as @BACKEND_PORT@). fakesrv runs as a SEPARATE
    # OS process from nginx, so it is never an entry in this worker's
    # cycle->listening and ngx_close_listening_sockets() cannot touch it --
    # the draining worker can still open a brand-new connection to it after
    # QUIT, same as before the signal. The upstream is not otherwise part of
    # what this scenario is proving (the body-read-before-connect property
    # above holds regardless of what answers on the other end); it exists
    # only so the QUIT leg's oracle -- a real `HTTP/1.1 200` + `UPLOADED` --
    # has something to receive.
    server {
        listen 127.0.0.1:@PORT@;

        location /upload {
            client_max_body_size 10m;
            # gixy flags proxy_pass_normalized on the literal path below. It
            # does not apply here: the URI is a fixed literal with no variable
            # or $request_uri interpolation, so there is no client-controlled
            # component to double-decode.
            proxy_pass http://127.0.0.1:@BACKEND_PORT@/upload;
        }

        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
