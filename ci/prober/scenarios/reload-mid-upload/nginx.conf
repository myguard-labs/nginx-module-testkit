@LOAD@
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    @PROBE_ZONE@
    server {
        listen 127.0.0.1:@PORT@;

        # The upload mirror of backend-reload-inflight: instead of a slow
        # DOWNLOAD dripping out of a fake backend, the client drips a slow
        # request BODY on its own write side and there is no backend at all --
        # nginx itself must read+buffer the whole body before it can respond.
        #
        # A bare `return 200` does NOT read the request body -- verified: with
        # `client_body_in_file_only on; return 200 ...;`, the response arrives
        # after just the first ~4 bytes / 0.3s of the drip, because `return`
        # fires in the rewrite phase and short-circuits BEFORE the body is
        # read; client_body_in_file_only only matters to a content handler
        # that actually reads the body, which `return` is not. That earlier
        # config made every downstream oracle vacuous: the 200 proved nothing
        # about surviving a reload mid-upload, since it was never mid-upload.
        #
        # proxy_pass with proxy_request_buffering on (the default) is the
        # correct mechanism: nginx buffers the ENTIRE request body before it
        # opens the upstream connection, so the 200 cannot arrive until the
        # full body has been read. Proxying to a same-server sink location
        # keeps this self-contained (no external backend needed).
        location /upload {
            client_max_body_size 10m;
            proxy_pass http://127.0.0.1:@PORT@/sink;
        }
        location /sink { return 200 "UPLOADED\n"; }

        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
