@LOAD@
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    @PROBE_ZONE@
    server {
        # `ssl` WITH `http2 on;` -- the one thing this scenario needs that
        # alpn-negotiation's listener deliberately withholds. That scenario's
        # third attack case relies on THIS listener being unable to satisfy an
        # "h2" ALPN offer; this one exists so exactly one listener in the tree
        # CAN, and H2-2's round trip has somewhere real to land.
        listen 127.0.0.1:@PORT@ ssl;
        http2 on;

        ssl_certificate     @PREFIX@/probe.crt;
        ssl_certificate_key @PREFIX@/probe.key;

        # Every case here performs its own full handshake -- see
        # alpn-negotiation/nginx.conf's identical comment for why session
        # resumption would silently turn a later case into a different test.
        ssl_session_tickets off;
        ssl_session_cache   off;

        location / { return 200 "OK\n"; }

        location /__probe { @PROBE@ }
    }
}
