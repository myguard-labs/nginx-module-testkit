@LOAD@
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    @PROBE_ZONE@
    server {
        # `ssl` on the listen directive is the entire point of the scenario:
        # it is what makes the port reject the plaintext exchange every other
        # scenario in this tree performs, so a green run here is evidence the
        # client's TLS leg carried the request and not evidence that TLS was
        # quietly skipped. The requires gate refuses to run this at all on a
        # build without ngx_http_ssl_module, because `listen ... ssl` there is
        # a config-test error rather than a scenario failure.
        listen 127.0.0.1:@PORT@ ssl;

        # Minted into the prefix by ./env before this conf was rendered. Both
        # paths are absolute: nginx resolves a relative path against its
        # compiled-in prefix, not against the rendered conf.
        ssl_certificate     @PREFIX@/probe.crt;
        ssl_certificate_key @PREFIX@/probe.key;

        # A session cache would let a second connection resume rather than
        # perform a full handshake. Every case in this scenario opens its own
        # connection and each is meant to exercise the handshake, so caching
        # would silently turn all but the first into a different test.
        ssl_session_tickets off;
        ssl_session_cache   off;

        # Bodies are chosen so the assertions can tell the two locations apart
        # without depending on a status alone -- a TLS transport that returned
        # the right status with an empty or truncated body is a defect this
        # scenario must be able to see.
        location / { return 200 "OK\n"; }

        location /longer {
            # Long enough to cross a single TLS record and a single read, so
            # the case below proves the client reassembles across records
            # rather than happening to fit one.
            return 200 "abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789vwxyz\n";
        }

        location /__probe { @PROBE@ }
    }
}
