@LOAD@
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    @PROBE_ZONE@

    # CRITICAL: the idle client keepalive connection under test must NOT be
    # closed by the keepalive idle timer within the test window -- only the
    # reload (graceful worker shutdown) may close it. An hour is far longer
    # than the driver ever waits, so any close the driver observes is
    # reload-caused, not timeout-caused. This is what makes assertion 4 in
    # driver.sh a genuine proof rather than a race against the idle timer.
    keepalive_timeout 3600s;
    # Keep the connection reusable well past one request so nothing but the
    # reload forces a close.
    keepalive_requests 1000;

    server {
        listen 127.0.0.1:@PORT@;

        # A plain, Content-Length-delimited body: the client reads exactly
        # one full response and then knows the connection is idle (not
        # mid-response), without needing chunked-transfer bookkeeping.
        location / { return 200 "OK\n"; }

        location /__probe { @PROBE@ }
    }
}
