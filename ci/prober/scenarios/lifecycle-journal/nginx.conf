@LOAD@
daemon on;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log notice;
worker_processes 1;
events { worker_connections 16; }
http {
    @PROBE_ZONE@
    # No upstream: this scenario's subject is the master/worker termination
    # journal built from nginx's own lifecycle log lines, not module behaviour.
    server {
        listen 127.0.0.1:@PORT@;
        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
