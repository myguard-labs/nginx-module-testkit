@LOAD@
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    @PROBE_ZONE@
    server {
        listen 127.0.0.1:@PORT@;

        # Short on purpose, and the opposite of conn-delta's reasoning. This
        # scenario asserts that an ARMED timer is disarmed again, so the timers
        # have to arm in the first place: a header read that stalls is what puts
        # an entry in the event-timer rbtree at all. Kept well above the pacing
        # the dribbled cases below use (4 bytes / 20 ms) so the timeout does not
        # fire mid-case and reclaim the connection by its own path -- that would
        # disarm the timer for a reason this scenario is not testing.
        client_header_timeout 5s;
        client_body_timeout   5s;

        # No keepalive: a kept-alive connection holds its own timer between
        # requests, so the closing baseline would read a timer that is armed on
        # purpose and indistinguishable from a leaked one.
        keepalive_timeout     0;

        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
