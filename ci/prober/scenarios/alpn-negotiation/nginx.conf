@LOAD@
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    @PROBE_ZONE@
    server {
        # `ssl` WITHOUT `http2`, and that omission is the fixture rather than a
        # gap in it. nginx's ALPN callback advertises exactly the protocols the
        # listener is configured for -- `http/1.1` here, plus `h2` only when
        # the listener carries it -- and answers an offer it cannot satisfy
        # with RFC 7301's `no_application_protocol` alert (120), which is fatal
        # to the handshake.
        #
        # That makes this listener the natural target for the row's third
        # attack: offering `h2` to a listener not configured for it. Measured
        # 2026-08-27 against .build/nginx-1.31.4 on this box -- `openssl
        # s_client -alpn h2` gets alert 120 and no connection, `-alpn http/1.1`
        # negotiates, and `-alpn h2,http/1.1` falls back to http/1.1. None of
        # the three needs ngx_http_v2_module linked, which is just as well:
        # measured the same day, NO build tree in .build/ carries it.
        listen 127.0.0.1:@PORT@ ssl;

        ssl_certificate     @PREFIX@/probe.crt;
        ssl_certificate_key @PREFIX@/probe.key;

        # Every case here opens its own connection and each is meant to perform
        # a full handshake -- a resumed session would skip the very ALPN
        # negotiation under test, so caching would silently turn all but the
        # first case into a different test.
        ssl_session_tickets off;
        ssl_session_cache   off;

        location / { return 200 "OK\n"; }

        location /__probe { @PROBE@ }
    }
}
