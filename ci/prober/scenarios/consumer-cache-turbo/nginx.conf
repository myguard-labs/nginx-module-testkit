@LOAD@
# CONSUMER MODULE under test: nginx-cache-turbo-module, built into the same
# objs/ dir as the ref probe (grind item H3, "second consumer zero-hook").
# @LOAD@ above load_modules the probe; @BUILD_OBJS@ resolves to that objs/ dir
# so this scenario loads the second, consumer .so itself -- same shape as
# reload-compressing's http-zstd load. On a tree lacking the .so, ./requires
# has already SKIPped the scenario, so this line is only reached where it
# exists.
load_module @BUILD_OBJS@/ngx_http_cache_turbo_module.so;
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    @PROBE_ZONE@

    # In-memory (shm) L1 zone only -- no cache_turbo_redis, no external
    # backend process. The zone + its config-pool dict are allocated ONCE at
    # config-parse/init time (config pool / shm), not per request, which is
    # exactly the property oracle 3/4 rely on: a per-request leak must show up
    # as cycle-pool growth, not as zone-lifecycle noise. 8 pages is the
    # documented minimum (README: "enforced at 8 x ngx_pagesize").
    cache_turbo_zone name=ct 8m;

    server {
        listen 127.0.0.1:@PORT@;

        # The real origin: a small, deterministic, cacheable static response.
        # A fixed body (not time-varying) so a HIT and the origin fetch are
        # byte-identical and the test needs no body-diffing logic -- the point
        # of this scenario is allocation neutrality, not content correctness
        # (that is covered by the module's own CI).
        location /origin {
            default_type text/plain;
            return 200 "cache-turbo-h3-payload\n";
        }

        # The cached location: proxies to /origin on the SAME server (no
        # external fake upstream needed -- unlike reload-compressing's
        # memcached drip, this scenario has no reason to exercise a slow or
        # adversarial backend, only a genuine HIT path through the filter).
        location / {
            cache_turbo       ct;
            cache_turbo_valid 60s;
            proxy_pass        http://127.0.0.1:@PORT@/origin;
        }

        location /__probe { @PROBE@ }
    }
}
