@LOAD@
daemon on;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log notice;
worker_processes 1;

# No worker_shutdown_timeout tuning here on purpose: USR1 is a log-reopen
# signal, not a shutdown signal, and nothing in this scenario ever asks a
# worker to drain and exit. The in-flight request this scenario drips through
# USR1 must survive it UNCHANGED -- proving USR1 costs nothing to a live
# connection is the whole point, so anything that could make a request
# terminate early (a short timeout, a forced reload) would work against that.
events { worker_connections 16; }
http {
    @PROBE_ZONE@

    # Same reasoning as lifecycle-quit-vs-term-drain's own /upload: a bare
    # `return 200` never reads the request body, which would make "the
    # in-flight upload survived USR1 undisturbed" vacuous. `mirror` +
    # `mirror_request_body on` forces the full body through an INTERNAL
    # subrequest before the response can finish, with no second TCP
    # connection -- unlike that scenario, USR1 does NOT close listening
    # sockets (only QUIT does, ngx_process_cycle.c's "gracefully shutting
    # down" arm), so a proxy_pass-to-self would in fact survive USR1 fine;
    # `mirror` is kept anyway for the same body-is-read guarantee and so both
    # lifecycle scenarios share one proven idiom instead of two.
    server {
        listen 127.0.0.1:@PORT@;

        location /upload {
            client_max_body_size 10m;
            mirror /drain;
            mirror_request_body on;
            return 200 "UPLOADED\n";
        }
        location /drain { internal; return 200; }

        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
