@LOAD@
daemon on;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log notice;
worker_processes 1;

# No worker_shutdown_timeout tuning here on purpose: USR1 is a log-reopen
# signal, not a shutdown signal, and nothing in this scenario ever asks a
# worker to drain and exit. The in-flight request this scenario drips through
# USR1 must survive it UNCHANGED -- proving USR1 costs nothing to a live
# connection is the whole point, so anything that could make a request
# terminate early (a short timeout, a forced reload) would work against that.
events { worker_connections 16; }
http {
    @PROBE_ZONE@

    # A bare `return 200` never reads the request body, which would make "the
    # in-flight upload survived USR1 undisturbed" vacuous. This is not a
    # guess: reload-mid-upload/nginx.conf records the same trap, observed --
    # with `return`, the response arrives after the first few dripped bytes.
    #
    # `mirror` + `mirror_request_body on` does NOT rescue it either, and an
    # earlier revision of this file wrongly assumed it did. `return` is an
    # ngx_http_rewrite_module directive running in NGX_HTTP_REWRITE_PHASE;
    # `mirror` installs its handler in NGX_HTTP_PRECONTENT_PHASE, which is
    # LATER (ngx_http_core_module.h phase enum). ngx_http_script_return_code()
    # calls ngx_http_send_response(), which first calls
    # ngx_http_discard_request_body() -- that returns NGX_OK immediately after
    # arming an asynchronous discard handler, it does not read the body to
    # completion -- then sends the response; ngx_http_core_rewrite_phase()
    # finalizes the request on that non-DECLINED return, so the phase engine
    # stops and the mirror handler NEVER RUNS.
    #
    # proxy_pass with proxy_request_buffering on (the default) is the
    # mechanism that actually works, and it is the one reload-mid-upload
    # already proves: nginx buffers the ENTIRE request body before opening
    # the upstream connection, so the 200 cannot arrive until the whole body
    # has been read. USR1 does not close listening sockets (only QUIT does,
    # ngx_process_cycle.c's "gracefully shutting down" arm), so proxying to a
    # same-server sink is safe here.
    server {
        listen 127.0.0.1:@PORT@;

        location /upload {
            client_max_body_size 10m;
            # gixy flags proxy_pass_normalized on the literal path below. It
            # does not apply here: the URI is a fixed literal with no variable
            # or $request_uri interpolation, so there is no client-controlled
            # component to double-decode.
            proxy_pass http://127.0.0.1:@PORT@/sink;
        }
        location /sink { return 200 "UPLOADED\n"; }

        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
