@LOAD@
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;

# Four workers, and that is the whole scenario. Every other leg of this lens
# (assert_test.c's unit fixtures) exercises the oracles as pure functions over
# synthetic readings; none of them boots a master, forks a worker, maps a shm
# zone or runs nginx's accept path. This conf is the only place where the pid
# a `fanout` leg reads is a real worker's pid.
#
# The opt-in that lets worker_processes != 1 past prober_check_conf's bail
# lives in ./env (PROBER_ALLOW_MULTIWORKER=1) -- the two must stay together,
# and the contract that pairing carries is spelled out there and in
# multi-worker.rule.
worker_processes 4;

# Comfortably above the fanout width below. A fanout leg is one connection at a
# time (the executor is sequential by design), so the ceiling only has to cover
# the probe read that follows each leg, but a tight limit here would turn a
# coverage shortfall into a connection error and hide which one happened.
events { worker_connections 100; }

http {
    @PROBE_ZONE@

    # No keepalive across legs: each fanout leg is a fresh connection, which is
    # precisely what gives the accept path a chance to hand the request to a
    # different worker. A reused connection stays pinned to the worker that
    # accepted it, which is why `fanout` refuses to be combined with `block`.
    keepalive_timeout 0;

    server {
        listen 127.0.0.1:@PORT@;
        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
