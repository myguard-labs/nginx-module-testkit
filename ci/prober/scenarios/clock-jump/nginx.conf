@LOAD@
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;

# THE REASON THIS SCENARIO WAS INERT UNTIL 2026-07-29.
#
# nginx does not pass its own environment to its workers: ngx_set_environment()
# builds a fresh environ from the `env` directives alone (plus TZ), so a worker
# inherits ONLY what is named here. LD_PRELOAD is honoured by the dynamic loader
# at exec time and the library stays MAPPED in the forked worker -- measured: 7
# libfaketime entries in /proc/<worker>/maps -- but with FAKETIME_TIMESTAMP_FILE
# stripped from its environ the library has nothing to read and reports the real
# clock. The symptom is a scenario that boots cleanly, serves every request, and
# silently ignores every step: stepping the clock -1h moved the worker's `Date`
# header FORWARD by one second.
#
# Naming a variable with no value re-exports the harness's own, which is what
# these four do (the values are set by the scenario's `env` file).
env LD_PRELOAD;
env FAKETIME_TIMESTAMP_FILE;
env FAKETIME_NO_CACHE;
env FAKETIME_DONT_FAKE_MONOTONIC;

events { worker_connections 64; }

http {
    @PROBE_ZONE@

    # The oracle's instrument. A short keepalive timeout settles the question in
    # ~2s instead of the default ~75s, and this timer is what the wall-clock step
    # is aimed at: if elapsed time were computed from CLOCK_REALTIME, stepping
    # the clock back an hour would push this expiry an hour into the future and
    # the parked connection would hang instead of closing.
    keepalive_timeout 2s;

    server {
        listen 127.0.0.1:@PORT@;
        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
